name: Sync Google Sheets to JSON

on:
  schedule:
    # Jalan otomatis tiap 30 menit (bisa sesuaikan cron schedule)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Tombol trigger manual di tab Actions GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Fetch Script
        run: python scripts/fetch_data.py

      - name: Commit and Push Updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto sync data from Google Sheets"
          file_pattern: "data/*.json"
