<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Performance Hub - Digimap</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--glass-bg:rgba(30,41,59,.75);--glass-border:rgba(255,255,255,.1);--text-main:#f8fafc;--text-muted:#94a3b8;--accent:#38bdf8;--card-bg:rgba(15,23,42,.65);--table-hover:rgba(56,189,248,.08);--input-bg:rgba(0,0,0,.25);--opt-bg:#1e293b}
    [data-theme="light"]{--bg-gradient:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--glass-bg:rgba(255,255,255,.88);--glass-border:rgba(0,0,0,.08);--text-main:#0f172a;--text-muted:#64748b;--accent:#0284c7;--card-bg:rgba(255,255,255,.75);--table-hover:rgba(2,132,199,.06);--input-bg:rgba(255,255,255,.9);--opt-bg:#fff}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;transition:background-color .25s ease,color .25s ease}
    body{background:var(--bg-gradient);min-height:100vh;color:var(--text-main);padding:24px}
    .app-shell{max-width:1440px;margin:0 auto;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:24px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
    .brand h1{font-size:1.5rem;font-weight:700;letter-spacing:-.5px}
    .brand p{font-size:.85rem;color:var(--text-muted)}
    .header-actions{display:flex;align-items:center;gap:12px}
    .status-pill{font-size:.8rem;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:#10b981;font-weight:500}
    .btn-icon{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-main);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.85rem}
    .btn-icon:hover{background:var(--accent);color:#fff}
    .nav-tabs{display:flex;gap:8px;background:var(--card-bg);padding:6px;border-radius:16px;border:1px solid var(--glass-border);margin-bottom:24px}
    .tab-btn{flex:1;padding:10px 16px;border:none;background:transparent;color:var(--text-muted);font-weight:600;border-radius:10px;cursor:pointer;text-align:center}
    .tab-btn.active{background:var(--accent);color:#fff}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
    .kpi-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:16px;padding:18px}
    .kpi-title{font-size:.8rem;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
    .kpi-value{font-size:1.8rem;font-weight:700}
    .content-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}
    @media(max-width:1024px){.content-grid{grid-template-columns:1fr}}
    .panel-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:16px;padding:20px;min-width:0}
    .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    .panel-title{font-size:1.05rem;font-weight:600}
    .controls-row{display:flex;gap:12px;align-items:center;width:100%;margin-bottom:16px;flex-wrap:wrap}
    .search-box{flex:2;min-width:180px;padding:10px 16px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-main);outline:none}
    .select-box{flex:1;min-width:150px;padding:10px 14px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-main);outline:none;cursor:pointer}
    .select-box option,.select-box optgroup{background:var(--opt-bg);color:var(--text-main)}
    .table-container{overflow-x:auto;max-height:520px;border-radius:12px;border:1px solid var(--glass-border)}
    table{width:100%;border-collapse:collapse;text-align:left;font-size:.85rem;white-space:nowrap}
    th{background:var(--opt-bg);padding:12px 16px;color:var(--text-muted);font-weight:600;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--glass-border)}
    td{padding:12px 16px;border-bottom:1px solid var(--glass-border)}
    tr:hover td{background:var(--table-hover)}
    .pagination-bar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--text-muted)}
    .pagination-buttons{display:flex;gap:6px;align-items:center}
    .page-btn{padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-main);border-radius:8px;cursor:pointer;font-size:.8rem}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .module-panel{display:none}.module-panel.active{display:block}
  
    .header-actions{flex-wrap:wrap}
    .status-pill,.btn-icon{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;line-height:1;white-space:nowrap}
    .btn-icon:disabled{opacity:.65;cursor:wait}
    .btn-icon.loading span{display:inline-block;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-pill.loading{color:var(--accent)}
    .status-pill.warn{color:#f59e0b}
    .content-grid{align-items:stretch}
    .content-grid>.panel-card:last-child{display:flex;flex-direction:column}
    .chart-wrap{position:relative;flex:1;min-height:280px}
    .chart-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
    .muted{color:var(--text-muted)}
    .sum-wrap{margin-bottom:24px}
    .sum-wrap .kpi-value{font-size:1.4rem}
    .sum-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .sum-title{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin-bottom:8px}
    .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-track{height:8px;border-radius:99px;background:var(--input-bg);overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:var(--accent)}
    .bar-val{font-weight:600}
  
    body{background:var(--bg-gradient) fixed}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(620px 320px at 8% -4%,rgba(56,189,248,.18),transparent),radial-gradient(520px 320px at 96% 0,rgba(129,140,248,.17),transparent)}
    .app-shell{position:relative;z-index:1}
    .brand h1{background:linear-gradient(90deg,var(--text-main),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
    .status-pill{padding:0 16px 0 14px;background:var(--card-bg);font-size:.78rem;font-weight:600;letter-spacing:.2px}
    .status-pill::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;border-radius:99px;cursor:pointer;color:#fff;font-weight:700;font-size:.85rem;background:linear-gradient(135deg,#38bdf8,#6366f1);box-shadow:0 6px 18px rgba(99,102,241,.35);transition:transform .15s ease,box-shadow .15s ease,opacity .2s}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(99,102,241,.5)}
    .btn-primary:active{transform:translateY(0)}
    .btn-primary:disabled{opacity:.75;cursor:wait;transform:none}
    .btn-primary.loading svg{animation:spin .9s linear infinite}
    .btn-theme{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;cursor:pointer;color:var(--text-main);background:var(--card-bg);border:1px solid var(--glass-border)}
    .btn-theme:hover{color:var(--accent);border-color:var(--accent)}
    [data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
    .nav-tabs{overflow-x:auto;scrollbar-width:none}
    .tab-btn{white-space:nowrap;padding:10px 20px}
    .tab-btn.active{background:linear-gradient(135deg,var(--accent),#6366f1);box-shadow:0 4px 14px rgba(99,102,241,.35)}
    .kpi-card{transition:transform .15s ease,border-color .15s ease}
    .kpi-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .chips{display:flex;gap:6px}
    .chip{padding:5px 12px;border-radius:99px;border:1px solid var(--glass-border);background:transparent;color:var(--text-muted);font-size:.75rem;font-weight:600;cursor:pointer}
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .live-badge{font-size:.75rem;font-weight:600;color:#10b981}
    .roster th,.roster td{white-space:nowrap}
    .roster th:nth-child(1),.roster td:nth-child(1){position:sticky;left:0;min-width:240px;background:var(--opt-bg);z-index:1}
    .roster th:nth-child(2),.roster td:nth-child(2){position:sticky;left:240px;min-width:130px;background:var(--opt-bg);z-index:1}
    .roster th:nth-child(-n+2){z-index:3}
    .roster th.dc{text-align:center;padding:8px 6px;line-height:1.25;min-width:38px}
    .roster td.sh{text-align:center;font-weight:700;padding:8px 6px}
    .roster .today{box-shadow:inset 0 0 0 1px var(--accent)}
    .roster th.today{color:var(--accent)}
    .sh-e{background:rgba(52,211,153,.2);color:#10b981}.sh-m{background:rgba(251,191,36,.2);color:#d97706}
    .sh-l{background:rgba(129,140,248,.22);color:#6366f1}.sh-x{background:rgba(148,163,184,.18);color:var(--text-muted)}
  
    .nav-tabs{position:sticky;top:10px;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .btn-primary{position:relative;overflow:hidden;min-width:150px;justify-content:center}
    .btn-primary .fill{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:rgba(255,255,255,.32);transition:width .35s ease;pointer-events:none}
    .btn-primary svg,.btn-primary .lbl{position:relative}
    .btn-primary.loading svg{animation:none}
    .btn-primary.done{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 6px 18px rgba(16,185,129,.4)}
    .clickable{cursor:pointer}
    .bar-row.clickable:hover{background:var(--table-hover);border-radius:8px}
    tr.clickable:hover td{background:var(--table-hover)}
    tr.totrow td{font-weight:700;background:var(--table-hover)}
    .modal-ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.62);backdrop-filter:blur(4px)}
    .modal-ov.open{display:flex}
    .modal{width:min(1100px,94vw);max-height:86vh;display:flex;flex-direction:column;background:var(--opt-bg);border:1px solid var(--glass-border);border-radius:20px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
    .modal-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
    .modal-t{font-size:1.1rem;font-weight:700}
    .modal .table-container{flex:1;min-height:0;max-height:none}
    .badge{padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:700}
    .b-plan{background:rgba(251,191,36,.18);color:#d97706}.b-del{background:rgba(16,185,129,.18);color:#10b981}
    .b-man{background:rgba(244,63,94,.16);color:#f43f5e}.b-oth{background:rgba(56,189,248,.18);color:var(--accent)}
    .pct{font-weight:700}.pct.g{color:#10b981}.pct.a{color:#d97706}.pct.r{color:#f43f5e}
    .pbar{display:inline-block;width:60px;height:6px;border-radius:99px;background:var(--input-bg);vertical-align:middle;margin-left:8px;overflow:hidden}
    .pbar i{display:block;height:100%;background:var(--accent)}
    .matrix th,.matrix td{white-space:nowrap}
    .matrix th:nth-child(1),.matrix td:nth-child(1){position:sticky;left:0;min-width:200px;background:var(--opt-bg);z-index:1}
    
    .matrix th:nth-child(1){z-index:3}
    .matrix th.dc{text-align:center;padding:6px 4px;min-width:34px;line-height:1.2;font-size:.72rem}
    .matrix th.wk{color:#f43f5e}.matrix .today{box-shadow:inset 0 0 0 1px var(--accent)}
    .matrix td.mx{text-align:center;padding:6px 4px}
    .matrix td.on{background:rgba(56,189,248,.22);color:var(--accent);font-weight:700;cursor:pointer}
    .matrix td.mxt,.matrix tfoot td{font-weight:700;text-align:center}
    .av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;margin-right:10px;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#38bdf8,#6366f1);flex:none}
    .tcell{display:flex;align-items:center}
    .wa-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff!important;font-weight:700;font-size:.75rem;text-decoration:none;box-shadow:0 4px 12px rgba(37,211,102,.3);transition:transform .15s}
    .wa-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:.78rem}
    .roster td.sh{padding:6px 4px}
    .cap-grid,.rapor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .cap{border-radius:16px;padding:14px 16px;border:1px solid var(--glass-border);background:var(--card-bg);cursor:pointer;transition:transform .15s,border-color .15s}
    .cap:hover{transform:translateY(-3px);border-color:var(--accent)}
    .cap .v{font-size:1.6rem;font-weight:800;margin:2px 0}
    .cap .l{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
    .cap.e{border-left:4px solid #10b981}.cap.m{border-left:4px solid #f59e0b}.cap.l2{border-left:4px solid #6366f1}.cap.x{border-left:4px solid #94a3b8}
    .mod-card{border-radius:16px;padding:16px;border:1px solid var(--glass-border);background:var(--card-bg);cursor:pointer;transition:transform .15s,border-color .15s}
    .mod-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .mod-card .v{font-size:1.7rem;font-weight:800}
    .mod-card .ln{font-size:.78rem;color:var(--text-muted);margin-top:4px}
  
    /* ===== APPLE-STYLE THEME ===== */
    :root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;--bg-gradient:#000;--glass-bg:rgba(28,28,30,.72);--glass-border:rgba(255,255,255,.09);--text-main:#f5f5f7;--text-muted:#98989f;--accent:#0a84ff;--card-bg:rgba(28,28,30,.72);--table-hover:rgba(10,132,255,.12);--input-bg:rgba(118,118,128,.24);--opt-bg:#1c1c1e;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 40px rgba(0,0,0,.45);--seg:#3a3a3c}
    [data-theme="light"]{--bg-gradient:#f5f5f7;--glass-bg:rgba(255,255,255,.78);--glass-border:rgba(0,0,0,.07);--text-main:#1d1d1f;--text-muted:#6e6e73;--accent:#0071e3;--card-bg:rgba(255,255,255,.86);--table-hover:rgba(0,113,227,.07);--input-bg:rgba(118,118,128,.12);--opt-bg:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.07);--seg:#ffffff}
    *{font-family:var(--font);-webkit-font-smoothing:antialiased}
    html{-webkit-text-size-adjust:100%}
    body{background:var(--bg-gradient) fixed;padding:clamp(12px,3vw,32px);letter-spacing:-.011em}
    body::before{background:radial-gradient(900px 420px at 12% -10%,rgba(10,132,255,.14),transparent),radial-gradient(700px 380px at 100% 0,rgba(94,92,230,.12),transparent)}
    [data-theme="light"] body::before{background:radial-gradient(900px 420px at 12% -10%,rgba(0,113,227,.07),transparent),radial-gradient(700px 380px at 100% 0,rgba(175,82,222,.06),transparent)}
    .app-shell{max-width:1360px;background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;border-radius:0}
    header{border:0;padding:0;margin-bottom:22px}
    .brand h1{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:700;letter-spacing:-.035em;line-height:1.1;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--text-main);-webkit-text-fill-color:var(--text-main)}
    .brand p{font-size:.85rem;letter-spacing:0;text-transform:none;color:var(--text-muted);margin-top:4px;font-weight:500}
    .status-pill{background:var(--card-bg);border:1px solid var(--glass-border);color:#30d158;text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:600;backdrop-filter:blur(20px)}
    .status-pill.loading{color:var(--accent)}.status-pill.warn{color:#ff9f0a}
    .status-pill::before{animation:pulseA 2s infinite}
    @keyframes pulseA{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 7px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
    .btn-primary{background:var(--accent);color:#fff;letter-spacing:0;text-transform:none;font-size:.82rem;font-weight:600;box-shadow:0 4px 14px rgba(10,132,255,.35)}
    .btn-primary:hover{box-shadow:0 6px 20px rgba(10,132,255,.5)}
    .btn-primary .fill{background:rgba(255,255,255,.28)}
    .btn-primary.done{background:#30d158;box-shadow:0 4px 14px rgba(48,209,88,.4)}
    .btn-theme{background:var(--card-bg);border:1px solid var(--glass-border);color:var(--text-main)}
    .btn-theme:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
    .nav-tabs{background:var(--input-bg);border:0;border-radius:14px;padding:3px;gap:2px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);overflow-x:auto;scrollbar-width:none;top:8px}
    .nav-tabs::-webkit-scrollbar{display:none}
    .tab-btn{font-size:.82rem;letter-spacing:0;text-transform:none;font-weight:600;padding:9px 18px;border-radius:11px;color:var(--text-muted);flex:1 0 auto;background:transparent;box-shadow:none}
    .tab-btn:hover{color:var(--text-main)}
    .tab-btn.active{background:var(--seg);color:var(--text-main);box-shadow:0 1px 3px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.12)}
    .kpi-card,.panel-card,.cap,.mod-card{border-radius:20px;border:1px solid var(--glass-border);background:var(--card-bg);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
    .panel-card{padding:24px}
    .kpi-card{padding:18px 20px}
    .kpi-card:hover,.cap:hover,.mod-card:hover{transform:translateY(-2px);border-color:var(--glass-border);box-shadow:0 14px 40px rgba(0,0,0,.18)}
    .brand h1,.panel-title,.kpi-value,.cap .v,.mod-card .v,.modal-t{font-family:var(--font)!important}
    .panel-title{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
    .panel-header{border:0;padding-bottom:0;margin-bottom:16px}
    .kpi-title,.cap .l,.sum-title{font-size:.72rem;letter-spacing:.01em;text-transform:none;font-weight:600;color:var(--text-muted)}
    .kpi-value{font-size:2rem;font-weight:700;letter-spacing:-.03em;color:var(--text-main)}
    .cap .v,.mod-card .v{font-size:1.9rem;font-weight:700;letter-spacing:-.03em}
    .search-box,.select-box{border:0;border-radius:12px;background:var(--input-bg);color:var(--text-main);font-size:.85rem;padding:11px 14px}
    .search-box:focus,.select-box:focus{box-shadow:0 0 0 3px rgba(10,132,255,.35)}
    .table-container{border-radius:16px;border:1px solid var(--glass-border)}
    th{font-size:.7rem;letter-spacing:.02em;text-transform:none;color:var(--text-muted);background:var(--opt-bg);font-weight:600;border-bottom:1px solid var(--glass-border)}
    td{border-bottom:1px solid var(--glass-border);font-size:.85rem}
    .page-btn{border-radius:10px;border:0;background:var(--input-bg)}
    .page-btn:hover:not(:disabled){background:var(--accent);color:#fff}
    .bar-fill,.pbar i{background:linear-gradient(90deg,#0a84ff,#64d2ff)}
    .bar-track,.pbar{background:var(--input-bg)}
    .chip{border:0;background:var(--input-bg);color:var(--text-muted);letter-spacing:0;text-transform:none;font-size:.76rem}

  <script>
    const DATA_JSON_URL = "./data/data.json";
    const RECAP_SHEET_URL = "https://docs.google.com/spreadsheets/d/1_lvhYAt2RozrhqMWCzFVvm8bCPm4yunnYcie4nM55U4/gviz/tq?tqx=out:json&sheet=Recap";
    const AUTO_REFRESH_INTERVAL = 300000;
    const PAGE_SIZE = 50;
    const MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let recapMasterData = [];
    let recapByEmail = new Map(), recapByName = new Map(), resolveCache = new Map(), storeCores = [], storeByCode = new Map(), trainerRecs = [], pnrTargets = new Map(), trLabelCache = new Map();
    let storeIndex = new Map();
    let state = {
      ops: [], ems: [], pnr: [], activeModule: 'ops',
      pages: {
        ops: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' },
        ems: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' },
        pnr: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' }
      }
    };
    let chartInstances = {};

    const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[\u200b-\u200d\ufeff\u00a0]/g, ' ').replace(/\s+/g, ' ').trim();
    const NO_HO = 'Tanpa Area';

    function formatDateTime(dateInput) {
      if (!dateInput) return '';
      const date = new Date(dateInput);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).replace('.', ':');
    }

    function cleanHeaderName(str, type) {
      if (!str) return '';
      let clean = String(str).replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
      const lower = clean.toLowerCase();
      if (lower.includes('presenter name') || lower.includes('fill in your full name') || lower.includes('trainer name')) return type === 'pnr' ? 'Trainer Name' : 'Presenter';
      if (lower.includes('tanggal (') || lower.includes('tanggal ( hari')) return 'Tanggal Sesi';
      if (lower.includes('total participants') || lower.includes('berapa banyak pelanggan')) return 'Total Peserta';
      if (lower.includes('unit yang terjual')) return 'Unit Terjual';
      if (lower.includes('produk apa yang pelanggan minati') || lower.includes('pelanggan minati')) return 'Produk Minat';
      if (lower.includes('open studio topics')) return 'Topik Open Studio';
      if (lower.includes('report photo')) return 'Foto Laporan';
      if (lower.includes('timestamp') || lower.includes('waktu input')) return 'Waktu Input';
      if (clean.length > 22) clean = clean.split('(')[0].split(':')[0].trim();
      return clean;
    }

    /* ---------- Data master (sheet Recap) ---------- */
    function buildStoreIndex() {
      recapByEmail = new Map(); recapByName = new Map(); resolveCache = new Map(); trLabelCache = new Map();
      storeIndex = new Map(); storeCores = []; storeByCode = new Map(); trainerRecs = [];
      recapMasterData.forEach(r => {
        const k = norm(r.store);
        if (!k) return;
        let cur = storeIndex.get(k);
        if (!cur) {
          cur = { name: r.store, ho: r.trainerHO || '', type: r.type || '', trainers: new Set(), employees: 0 };
          storeIndex.set(k, cur);
          const code = (r.store.match(/\bm\d{2,4}\b/i) || [])[0];
          if (code) storeByCode.set(code.toLowerCase(), r.store);
          const toks = storeTokens(r.store);
          storeCores.push({ name: r.store, tokens: new Set(toks), key: toks.join('') });
        } else {
          if (!cur.ho && r.trainerHO) cur.ho = r.trainerHO;
          if (!cur.type && r.type) cur.type = r.type;
        }
        if (r.nama && r.nama !== '0') cur.employees++;
        if (r.email) recapByEmail.set(norm(r.email), r);
        if (r.nama) recapByName.set(norm(r.nama), r);
        const isTr = /trainer/i.test(r.position);
        const st = r.storeTrainer || (isTr ? r.nama : '');
        if (st && st !== '0') cur.trainers.add(st);
        if (isTr && r.nama) trainerRecs.push(r);
      });
    }

    function parseRecap(text) {
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const cols = (json.table?.cols || []).map(c => (c.label || '').trim());
      let rows = (json.table?.rows || []).map(r => (r.c || []).map(c => (c && c.v != null) ? String(c.v).trim() : ''));
      let headers = cols;
      if (!cols.some(Boolean) && rows.length) headers = rows.shift();

      const find = (re, exclude, fallback) => {
        const i = headers.findIndex((h, idx) => !exclude.includes(idx) && re.test(String(h).toLowerCase()));
        return i >= 0 ? i : fallback;
      };
      const iST = find(/store\s*trainer|trainer\s*store/, [], -1);
      const iType = find(/type\s*store|tipe\s*store/, [], 9);
      const iHO = find(/trainer\s*ho|ho\s*trainer|\bho\b/, [iST], 10);
      const iStore = find(/store|toko|cabang/, [iHO, iST, iType], 1);
      const iNama = find(/nama|name|presenter|trainer/, [iHO, iStore, iST, iType], 2);
      const iNik = find(/\bnik\b/, [], 3);
      const iExp = find(/work\s*experience|pengalaman/, [], 4);
      const iEmail = find(/email|e-mail/, [iHO, iStore, iNama, iST], 5);
      const iPos = find(/position|posisi|jabatan/, [iHO, iStore, iNama, iEmail, iST], 6);

      return rows.map(c => ({
        store: c[iStore] || '', nama: c[iNama] || '', email: c[iEmail] || '',
        position: c[iPos] || '', trainerHO: c[iHO] || '', storeTrainer: c[iST] || '', nik: c[iNik] || '', exp: c[iExp] || '', type: c[iType] || ''
      })).filter(r => r.store && r.store !== '0' && !/^\s*q\S*\d\S*(\s|$)/i.test(r.store)).map(r => {
        if (r.trainerHO === '0') r.trainerHO = '';
        if (r.nama === '0') r.nama = '';
        if (r.nik === '0') r.nik = '';
        if (r.type === '0') r.type = '';
        return r;
      });
    }

    async function fetchRecapMasterData() {
      try {
        const res = await fetch(RECAP_SHEET_URL + '&_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        recapMasterData = parseRecap(await res.text());
        localStorage.setItem('recap_cache', JSON.stringify(recapMasterData));
      } catch (err) {
        console.warn('Sheet Recap gagal dibaca, pakai cache:', err);
        try { recapMasterData = JSON.parse(localStorage.getItem('recap_cache') || '[]'); } catch (e) { recapMasterData = []; }
      }
      buildStoreIndex();
    }

    /* ---------- OPTIMASI 1: Metadata per baris Cache (O(1) Compute) ---------- */
    // Proses ini sekarang dihitung 1x di awal, tidak lagi setiap saat filtering/render
    const moduleKeysCache = { ops: null, ems: null, pnr: null };
    function getModuleKeys(type, row) {
        if (moduleKeysCache[type]) return moduleKeysCache[type];
        const keys = Object.keys(row);
        const findK = (kws, excl) => keys.find(k => kws.some(kw => String(k).toLowerCase().includes(kw)) && (!excl || !excl.test(k)));
        const m = {
            store: findK(['location', 'lokasi', 'store', 'toko', 'cabang', 'outlet'], /trainer|training|coaching|type|total/i),
            trainer: findK(['trainer', 'presenter', 'nama trainer', 'nama presenter', 'staff', 'nama', 'nps', 'participants name']),
            email: findK(['email', 'e-mail']),
            month: findK(['month', 'bulan']),
            year: findK(['year', 'tahun']),
            date: findK(['date', 'tanggal']),
            timestamp: findK(['timestamp', 'waktu']),
            status: findK(['status']),
            hours: findK(['hours']),
            topics: findK(['topics', 'topik', 'topic', 'kategori', 'category']),
            participant: findK(['participant', 'peserta']),
            units: findK(['unit yang terjual', 'unit terjual', 'terjual'])
        };
        moduleKeysCache[type] = m;
        return m;
    }

    const STOP = new Set(['digimap', 'apple', 'premium', 'partner', 'store', 'toko', 'ibox', 'mall', 'mal', 'street', 'raya', 'the']);
    function storeTokens(s) { return norm(s).replace(/\bm\d{2,4}\b/g, ' ').split(/[^a-z0-9]+/).filter(t => t && !STOP.has(t)); }
    function lev(a, b) {
      const m = a.length, n = b.length;
      if (Math.abs(m - n) > 2) return 3;
      let prev = Array.from({ length: n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = cur;
      }
      return prev[n];
    }
    
    function resolveStore(raw) {
      const hit = storeIndex.get(norm(raw));
      if (hit) return hit.name;
      if (resolveCache.has(raw)) return resolveCache.get(raw);
      const toks = storeTokens(raw), key = toks.join('');
      let best = null, bs = 0, tie = false;
      storeCores.forEach(c => {
        let sc = 0;
        if (key && c.key === key) sc = 100;
        else {
          const inter = toks.filter(t => c.tokens.has(t));
          if (inter.length && (inter.length === toks.length || inter.length === c.tokens.size) && inter.some(t => t.length >= 4)) sc = 10 + inter.length;
          else if (key.length >= 6 && c.key.length >= 6 && lev(key, c.key) <= 2) sc = 5;
        }
        if (sc > bs) { best = c; bs = sc; tie = false; } else if (sc && sc === bs) tie = true;
      });
      let out = raw;
      if (best && !tie) out = best.name;
      else { const code = (String(raw).match(/\bm\d{2,4}\b/i) || [])[0]; if (code && storeByCode.has(code.toLowerCase())) out = storeByCode.get(code.toLowerCase()); }
      resolveCache.set(raw, out);
      return out;
    }

    function monthKeyFromLabel(label) {
      const mi = MONTH_NAMES_ID.findIndex(n => label.toLowerCase().includes(n.toLowerCase()));
      const y = (label.match(/\b(19|20)\d{2}\b/) || [])[0];
      return mi >= 0 && y ? parseInt(y) * 100 + mi : 0;
    }

    const MONTH_NAMES_EN = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    function monthFromText(low) {
      for (let i = 0; i < 12; i++) {
        if (new RegExp('\\b(' + MONTH_NAMES_ID[i].toLowerCase() + '|' + MONTH_NAMES_EN[i] + ')\\b').test(low)) return i;
      }
      return -1;
    }
    function parseAnyDate(v) {
      const s = String(v).trim(), low = s.toLowerCase();
      let m = s.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/);
      if (m) return new Date(+m[1], +m[2], +m[3]);
      const yr = low.match(/\b((?:19|20)\d{2})\b/), mi = monthFromText(low);
      if (mi >= 0 && yr) { const dm = low.replace(yr[1], ' ').match(/(?<!\d)(0?[1-9]|[12]\d|3[01])(?!\d)/); return new Date(+yr[1], mi, dm ? +dm[1] : 1); }
      m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]); // dd/mm/yyyy
      if (/^\d{1,3}$/.test(s)) return null;
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }

    const hourNum = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
    const tokensOf = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
    function sameName(a, b) {
      const x = tokensOf(a), y = tokensOf(b);
      if (!x.length || !y.length) return false;
      const [sm, lg] = x.length <= y.length ? [x, y] : [y, x];
      return sm.every(t => lg.includes(t)) && (sm.length >= 2 || sm[0].length >= 4);
    }

    // Hitung Meta Sekali Saja
    function _calcMeta(type, row) {
      const mk = getModuleKeys(type, row);
      
      let storeRaw = mk.store && row[mk.store] ? String(row[mk.store]).trim() : '';
      if (['-', '0', ''].includes(storeRaw)) storeRaw = '';
      let trainerRaw = mk.trainer && row[mk.trainer] ? String(row[mk.trainer]).trim() : '';
      if (['-', '0', ''].includes(trainerRaw)) trainerRaw = '';

      let store = storeRaw ? resolveStore(storeRaw) : '';
      let trainer = trainerRaw;
      let rec = null;

      if (!store || !trainer) {
        const em = mk.email && row[mk.email] ? String(row[mk.email]).trim() : '';
        rec = (em && recapByEmail.get(norm(em))) || (trainer && recapByName.get(norm(trainer))) || null;
        if (rec) {
          if (!store && rec.store) store = resolveStore(rec.store);
          if (!trainer) trainer = rec.nama || '';
        }
      }

      // Parsing Tanggal
      let mi = null;
      let mName = mk.month ? String(row[mk.month] || '').trim() : '';
      let yr = mk.year ? String(row[mk.year] || '').trim() : '';
      let dd = mk.date ? String(row[mk.date] || '').trim() : '';

      if (mName && /^\d{4}$/.test(yr)) {
        const mIdx = monthFromText(norm(mName));
        if (mIdx >= 0) mi = { label: `${MONTH_NAMES_ID[mIdx]} ${yr}`, key: +yr * 100 + mIdx, date: new Date(+yr, mIdx, /^\d{1,2}$/.test(dd) ? +dd : 1) };
      }
      if (!mi) {
        const cands = [mName, dd, mk.timestamp ? String(row[mk.timestamp] || '') : ''];
        for (const v of cands) {
          if (!v) continue;
          const d = parseAnyDate(v);
          if (d && d.getFullYear() > 1990) { mi = { label: `${MONTH_NAMES_ID[d.getMonth()]} ${d.getFullYear()}`, key: d.getFullYear() * 100 + d.getMonth(), date: d }; break; }
        }
        if (!mi && mName) mi = { label: mName, key: monthKeyFromLabel(mName), date: null };
      }

      const idx = store ? storeIndex.get(norm(store)) : null;
      let ho = idx ? idx.ho : '';
      if (!ho) { const r2 = rec || (trainer && recapByName.get(norm(trainer))); if (r2 && r2.trainerHO) ho = r2.trainerHO; }

      let status = mk.status && row[mk.status] ? String(row[mk.status]).trim() : '';
      if (status) status = /plan/i.test(status) ? 'Planning' : /deliver/i.test(status) ? 'Delivered' : status;

      let h = null;
      if (mk.timestamp && row[mk.timestamp]) { const match = String(row[mk.timestamp]).match(/(\d{1,2}):\d{2}/); if (match) h = +match[1]; }
      if (h == null) {
        for (const k of Object.keys(row)) {
          if (!/jam|time|sesi|session|slot/i.test(k) || /timestamp|input/i.test(k)) continue;
          const m2 = String(row[k] || '').match(/(?<![\d:])([01]?\d|2[0-3])\s*[:.]\s*[0-5]\d(?!\d)/);
          if (m2) { h = +m2[1]; break; }
        }
      }
      let slot = h == null ? '' : h < 14 ? '13:00' : h < 17 ? '15:00' : '18:00';
      
      // Topik Cache
      let tMan = [], tOth = [], tAll = [];
      const split = v => String(v).split(/[,;\n]+/).map(x => x.trim()).filter(x => x && x !== '-' && x !== '0');
      if (type === 'pnr') {
         Object.keys(row).forEach(k => {
           const kl = k.toLowerCase();
           if (/photo|foto|email|date|tanggal|timestamp/.test(kl) || row[k] == null) return;
           const isM = kl.includes('mandatory'), isO = !isM && kl.includes('other');
           if (isM) tMan.push(...split(row[k]));
           if (isO) tOth.push(...split(row[k]));
         });
         tAll = [...tMan, ...tOth];
      } else {
         tAll = [(mk.topics && row[mk.topics]) ? String(row[mk.topics]).trim() : 'Lainnya'];
      }

      return { 
        store, trainer, month: mi ? mi.label : '', monthKey: mi ? mi.key : 0, date: mi && mi.date ? mi.date : null,
        ho, st: idx ? Array.from(idx.trainers) : [], status, slot, hours: mk.hours ? hourNum(row[mk.hours]) : 0,
        _part: mk.participant ? parseInt(row[mk.participant]) || 0 : 0,
        _units: mk.units ? parseInt(row[mk.units]) || 0 : 0,
        _topics: { all: tAll, mandatory: tMan, other: tOth }
      };
    }

    function precomputeAllMeta(forceRebuild = false) {
      ['ops', 'ems', 'pnr'].forEach(type => {
        const data = state[type] || [];
        data.forEach(row => {
          if (forceRebuild || !row._meta) { row._meta = _calcMeta(type, row); }
        });
      });
    }

    function getRowMeta(row) {
      return row._meta || {}; 
    }
    
    const fmtDate = d => `${d.getDate()} ${MONTH_NAMES_ID[d.getMonth()]} ${d.getFullYear()}`;
    const partOf = r => r._meta ? r._meta._part : 0;
    const unitsOf = r => r._meta ? r._meta._units : 0;
    function getTopics(type, row, mode) {
      if (!row._meta || !row._meta._topics) return [];
      if (type === 'pnr') {
        if (mode === 'mandatory') return row._meta._topics.mandatory;
        if (mode === 'other') return row._meta._topics.other;
      }
      return row._meta._topics.all;
    }
    const isQRow = r => /^\s*q\S*\d\S*(\s|$)/i.test(getRowMeta(r).store || '');

    /* ---------- Dropdown berkelompok & saling terhubung ---------- */
    function groupBy(items, keyFn) {
      const g = new Map();
      items.forEach(it => { const k = keyFn(it); if (!g.has(k)) g.set(k, []); g.get(k).push(it); });
      return g;
    }
    const byName = (a, b) => String(a||'').localeCompare(String(b||''), 'id', { numeric: true, sensitivity: 'base' });

    const DIMS = ['month', 'trainerHO', 'store', 'trainer', 'status'];
    function dimMatch(type, m, dim, v) {
      if (v == null || v === 'all') return true;
      if (dim === 'month') return m.month === v;
      if (dim === 'trainerHO') return type === 'pnr' ? m.st.includes(v) : m.ho === v;
      if (dim === 'store') return norm(m.store) === norm(v);
      if (dim === 'trainer') return norm(m.trainer) === norm(v);
      if (dim === 'status') return m.status === v;
      return true;
    }
    const rowOk = (type, m, p, skip) => DIMS.every(d => d === skip || dimMatch(type, m, d, p[d]));

    function trLabel(t) {
      let v = trLabelCache.get(t);
      if (v == null) {
        const a = [];
        storeIndex.forEach(s => { if (s.trainers.has(t)) a.push(s.name.replace(/\bdigimap\s+/i, '')); });
        v = a.length ? `${t} · ${a.join(', ')}` : t;
        trLabelCache.set(t, v);
      }
      return v;
    }
    function facet(type, dim, rows, tname) {
      const out = new Map();
      const add = (value, group, ord, label) => {
        if (!value) return;
        const e = out.get(value) || { value, count: 0, group, ord, label };
        e.count++; out.set(value, e);
      };
      rows.forEach(r => {
        if (dim === 'month') add(r.month, '', -r.monthKey);
        else if (dim === 'trainerHO') { if (type === 'pnr') r.st.forEach(t => add(t, '', 0, trLabel(t))); else add(r.ho); }
        else if (dim === 'store') add(r.store, type === 'pnr' ? (r.st.join(', ') || 'Tanpa Store Trainer') : (r.ho || NO_HO));
        else if (dim === 'trainer') add(tname.get(norm(r.trainer)), r.store || 'Tanpa Store');
        else if (dim === 'status') add(r.status);
      });
      return Array.from(out.values()).sort((a, b) => (a.ord || 0) - (b.ord || 0) || byName(a.value, b.value));
    }

    function fillSelect(id, defText, entries, current, grouped) {
      const el = document.getElementById(id);
      if (!el) return;
      const opt = e => `<option value="${escapeHtml(e.value)}">${escapeHtml(e.label || e.value)} (${e.count})</option>`;
      let html = `<option value="all">${defText}</option>`;
      if (grouped) {
        const g = groupBy(entries, e => e.group);
        Array.from(g.keys()).sort((a, b) => /^Tanpa/.test(a) - /^Tanpa/.test(b) || byName(a, b)).forEach(k => {
          html += `<optgroup label="${escapeHtml(k)}">${g.get(k).map(opt).join('')}</optgroup>`;
        });
      } else html += entries.map(opt).join('');
      el.innerHTML = html;
      el.value = current;
      if (el.value !== current) el.value = 'all';
    }

    function populateDropdowns(type) {
      const p = state.pages[type], isPNR = type === 'pnr';
      const metas = (state[type] || []).map(getRowMeta);
      const tname = new Map();
      metas.forEach(m => { const k = norm(m.trainer); if (k && !tname.has(k)) tname.set(k, m.trainer); });
      const dims = isPNR ? DIMS.filter(d => d !== 'trainer') : DIMS.filter(d => d !== 'status');
      const res = {};
      for (let pass = 0; pass < 4; pass++) {
        let changed = false;
        dims.forEach(d => {
          res[d] = facet(type, d, metas.filter(m => rowOk(type, m, p, d)), tname);
          if (p[d] !== 'all' && !res[d].some(e => e.value === p[d])) { p[d] = 'all'; changed = true; }
        });
        if (!changed) break;
      }
      const L = { month: '📅 Semua Bulan', trainerHO: isPNR ? '🏷️ Semua Store Trainer' : '👔 Semua Area', store: '🏪 Semua Store', trainer: '👤 Semua Staff', status: '📌 Semua Status' };
      const C = { month: 'Month', trainerHO: 'TrainerHO', store: 'Store', trainer: 'Trainer', status: 'Status' };
      dims.forEach(d => fillSelect(`${type}${C[d]}Filter`, L[d], res[d], p[d], d === 'store' || d === 'trainer'));
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- Ambil data aktivitas (OPS / EMS / PNR) ---------- */
    async function _fetchLatestData() {
      const lastSync = localStorage.getItem('last_sync');
      const fallbackTime = lastSync ? formatDateTime(lastSync) : formatDateTime(new Date());

      try {
        const res = await fetch(DATA_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('File data.json tidak ditemukan');
        const data = await res.json();

        if (data.status === 'success' || data.sheets) {
          state.ops = data.sheets?.ops || data.ops || [];
          state.ems = data.sheets?.ems || data.ems || [];
          state.pnr = data.sheets?.pnr || data.pnr || [];
        } else if (Array.isArray(data)) {
          state.ops = data;
        }
        const syncTimestamp = data.last_updated || new Date().toISOString();
        try {
          localStorage.setItem('cached_state', JSON.stringify({ ops: state.ops, ems: state.ems, pnr: state.pnr }));
          localStorage.setItem('last_sync', syncTimestamp);
        } catch (e) {}
        updateSyncStatus(`Diperbarui ${formatDateTime(syncTimestamp)}`);
      } catch (err) {
        console.warn('Membaca data dari cache lokal:', err);
        const cached = localStorage.getItem('cached_state');
        if (cached) {
          const parsed = JSON.parse(cached);
          state.ops = parsed.ops || [];
          state.ems = parsed.ems || [];
          state.pnr = parsed.pnr || [];
        }
        updateSyncStatus(`Offline · cache ${fallbackTime}`, 'warn');
      }
    }

    function refreshAll() {
      ['ops', 'ems', 'pnr'].forEach(t => { state[t] = (state[t] || []).filter(r => !isQRow(r)); }); 
      ['ops', 'ems', 'pnr'].forEach(populateDropdowns);
      renderCurrentModule();
    }

    function renderCurrentModule() {
      if (state.activeModule === 'ops') renderOPS();
      if (state.activeModule === 'ems') renderEMS();
      if (state.activeModule === 'pnr') renderPNR();
      if (state.activeModule === 'all') renderAllSummary();
      if (state.activeModule === 'roster') renderRoster();
    }

    function sortNewest(rows) {
      const dk = r => { const d = getRowMeta(r).date; return d ? d.getTime() : 0; };
      return rows.map((r, i) => [r, i, dk(r)]).sort((a, b) => b[2] - a[2] || b[1] - a[1]).map(x => x[0]);
    }
    function getFilteredData(type) {
      const p = state.pages[type], q = (p.filter || '').toLowerCase();
      return sortNewest((state[type] || []).filter(row => {
        if (!rowOk(type, getRowMeta(row), p)) return false;
        return !q || Object.values(row).some(v => String(v || '').toLowerCase().includes(q));
      }));
    }

    const STORE_TARGET = 85;
    function renderOPS() {
      const filteredData = getFilteredData('ops');
      let totalParticipants = 0, totalUnits = 0;
      const topicCounts = {};
      filteredData.forEach(row => {
        totalParticipants += partOf(row); totalUnits += unitsOf(row);
        getTopics('ops', row, 'all').forEach(t => { topicCounts[t] = (topicCounts[t] || 0) + 1; });
      });
      
      renderOpsStoreTable(filteredData);
      renderModuleSummary('ops', filteredData, [
        ['Rata-rata Peserta / Sesi', filteredData.length ? (totalParticipants / filteredData.length).toFixed(1).replace('.', ',') : '0'],
        ['Unit Terjual Setelah OPS / Peserta', totalParticipants ? (totalUnits / totalParticipants).toFixed(2).replace('.', ',') : '0']
      ]);
      renderChart('opsChart', topicCounts, k => openModal({ title: `Topik ${k}`, sub: 'OPS', ...detailRows('ops', filteredData.filter(r => getTopics('ops', r, 'all').includes(k))) }));
      renderCompare('ops'); renderMatrix('ops');
    }

    function renderOpsStoreTable(data) {
      const p = state.pages.ops;
      const blank = name => ({ name, s: { '13:00': 0, '15:00': 0, '18:00': 0 }, total: 0, rows: [] });
      const agg = new Map();
      data.forEach(r => {
        const m = getRowMeta(r), k = m.store || '(Tanpa Store)';
        let e = agg.get(k);
        if (!e) { e = blank(k); agg.set(k, e); }
        if (m.slot) e.s[m.slot]++;
        e.total++; e.rows.push(r);
      });
      if (!p.filter && p.store === 'all' && p.trainer === 'all' && p.trainerHO === 'all') storeIndex.forEach(v => { if (!agg.has(v.name)) agg.set(v.name, blank(v.name)); });
      const list = Array.from(agg.values()).sort((a, b) => b.total - a.total || byName(a.name, b.name));
      const sum = list.reduce((a, e) => { a.t += e.total; ['13:00', '15:00', '18:00'].forEach(k => { a[k] += e.s[k]; }); return a; }, { t: 0, '13:00': 0, '15:00': 0, '18:00': 0 });
      const cls = v => v >= 100 ? 'g' : v >= 50 ? 'a' : 'r';
      const pc = n => Math.round(n / STORE_TARGET * 100);
      document.getElementById('opsThead').innerHTML = ['Store', '13:00', '15:00', '18:00', 'TOTAL', 'TARGET', '%'].map(h => `<th>${h}</th>`).join('');
      const totTarget = STORE_TARGET * list.length, tp = totTarget ? Math.round(sum.t / totTarget * 100) : 0;
      const rowsHtml = list.map(e => {
        const v = pc(e.total);
        const dr = reg(() => ({ title: e.name, sub: `OPS ${fmt(e.total)} entry · target ${STORE_TARGET} (${v}%)`, ...detailRows('ops', e.rows) }));
        return `<tr class="clickable" onclick="openDrill(${dr})"><td>${escapeHtml(e.name)}</td><td>${e.s['13:00']}</td><td>${e.s['15:00']}</td><td>${e.s['18:00']}</td><td><strong>${e.total}</strong></td><td>${STORE_TARGET}</td><td><span class="pct ${cls(v)}">${v}%</span><span class="pbar"><i style="width:${Math.min(100, v)}%"></i></span></td></tr>`;
      }).join('');
      document.getElementById('opsTbody').innerHTML = list.length
        ? `<tr class="totrow"><td>Semua Store (${list.length})</td><td>${sum['13:00']}</td><td>${sum['15:00']}</td><td>${sum['18:00']}</td><td>${sum.t}</td><td>${fmt(totTarget)}</td><td><span class="pct ${cls(tp)}">${tp}%</span></td></tr>` + rowsHtml
        : '<tr><td colspan="7" style="text-align:center;padding:24px">Data tidak ditemukan untuk kombinasi filter ini.</td></tr>';
      document.getElementById('opsPagination').innerHTML = `<div>${list.length} store · target ${STORE_TARGET} entry per store${p.month === 'all' ? ' (pilih bulan agar % sesuai target bulanan)' : ''}</div><div>Klik store untuk melihat detail</div>`;
    }

    function renderEMS() {
      const d = getFilteredData('ems');
      renderTableWithPagination('ems', d);
      renderModuleSummary('ems', d);
      renderChart('emsChart', countTopics('ems', d), k => openModal({ title: `Topik ${k}`, sub: 'EMS', ...detailRows('ems', d.filter(r => getTopics('ems', r, 'all').includes(k))) }));
      renderCompare('ems'); renderMatrix('ems');
    }

    function renderPNR() {
      const d = getFilteredData('pnr');
      renderTableWithPagination('pnr', d);
      renderModuleSummary('pnr', d);
      renderChart('pnrChart', countTopics('pnr', d), k => openModal({ title: `Topik ${k}`, sub: 'PNR', ...detailRows('pnr', d.filter(r => getTopics('pnr', r, topicMode).includes(k))) }));
      renderCompare('pnr'); renderRekapPNR(); renderMatrix('pnr');
    }

    function getAllHeaders(data) {
