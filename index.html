          <div class="panel-card" data-title="Rekap per Area">${miniTable(['Area', 'OPS', 'EMS', 'PNR', 'Total'], hoRows, 340, hoDr)}</div>
        </div>
        <div class="panel-card sum-wrap" data-title="Rekap per Store"><div class="muted" style="font-size:.78rem;margin-bottom:8px">${storeRows.length} store aktif · klik baris untuk detail</div>
          ${miniTable(['Store', 'Area', 'Store Trainer', 'OPS', 'EMS', 'PNR', 'Total', 'Peserta', 'Unit Setelah OPS'], storeRows, 420, storeDr)}
        </div>
        <div class="panel-card sum-wrap">
          <div class="sum-cols">
            ${barList('Top 5 Store', countBy(sel, x => x.m.store), 5, k => mixedDetail(k, sel.filter(x => x.m.store === k)))}
            ${barList('Top 5 Staff', countBy(sel, x => x.m.trainer), 5, k => mixedDetail(k, sel.filter(x => x.m.trainer === k)))}
            ${overallBottomStaff(sel)}
            ${barList('Status PNR', countBy(pnrRows, x => x.m.status), 5, k => mixedDetail(`Status ${k}`, pnrRows.filter(x => x.m.status === k)))}
            ${barList('Top Topik OPS', topicOf('ops'), 5, topicD('ops'))}
            ${barList('Top Topik EMS', topicOf('ems'), 5, topicD('ems'))}
            ${barList('Top Topik PNR (Mandatory & Other)', topicOf('pnr'), 5, topicD('pnr'))}
          </div>
        </div>`;

      const root = getComputedStyle(document.documentElement);
      const tc = root.getPropertyValue('--text-main').trim(), mc = root.getPropertyValue('--text-muted').trim();
      lastAllSel = sel;
      host.querySelector('.filter-bar').insertAdjacentHTML('beforeend', `<div class="export-row">${EXPORT_BTN('all')}${CS_BTN('all')}</div>`);
      const modName = ['OPS', 'EMS', 'PNR'];
      host.querySelector('.content-grid').insertAdjacentHTML('beforebegin', `
        <div class="content-grid" style="grid-template-columns:1fr 1fr">
          <div class="panel-card" data-title="Grafik Line · Tren per Modul"><div class="muted" style="font-size:.78rem;margin:2px 0 12px">12 bulan terakhir · klik titik untuk detail</div><div class="chart-wrap" style="height:280px;flex:none;min-height:0"><canvas id="allLineChart"></canvas></div></div>
          <div class="panel-card" data-title="Grafik Line · Aktivitas Harian"><div class="muted" style="font-size:.78rem;margin:2px 0 12px" id="allDayLbl"></div><div class="chart-wrap" style="height:280px;flex:none;min-height:0"><canvas id="allDayChart"></canvas></div></div>
        </div>
        <div class="donut-grid">${[['allDonMod', 'Komposisi per Modul'], ['allDonStatus', 'Status PNR'], ['allDonStore', 'Top Store'], ['allDonHO', 'Entry per Area']].map(([id, t]) => `<div class="panel-card" data-title="${t}"><div class="muted" style="font-size:.74rem;margin:2px 0 8px">klik irisan untuk detail</div><div class="chart-wrap" style="height:250px;flex:none;min-height:0"><canvas id="${id}"></canvas></div></div>`).join('')}</div>`);
      const idleDetail = n => { const ix = storeIndex.get(norm(n)); return { title: n, sub: 'Belum ada aktivitas pada periode ini', heads: ['Area', 'Store Trainer', 'Total Employee'], rows: [[escapeHtml(ix && ix.ho || '-'), escapeHtml(ix && ix.trainers.size ? Array.from(ix.trainers).join(', ') : '-'), ix ? ix.employees : '-']] }; };
      host.insertAdjacentHTML('beforeend', `<div class="panel-card sum-wrap" data-title="Store Belum Ada Aktivitas"><div class="panel-header"><div><div class="muted" style="font-size:.8rem;margin-top:2px">${allMonth === 'all' ? 'Semua periode' : escapeHtml(allMonth)} · klik store untuk detail</div></div><span class="cap-count">${idle.length}</span></div><div class="capsules">${idle.map(n => `<span class="capsule clickable" onclick="openDrill(${reg(() => idleDetail(n))})">${escapeHtml(n)}</span>`).join('') || '<span class="muted">Semua store sudah punya aktivitas</span>'}</div></div>`);
      host.insertAdjacentHTML('beforeend', overallZero(sel));
      collapsify(host, 'all');
      const ml12 = monthEntries(flat.map(x => x.m), true).map(e => e[0]).slice(-12);
      const lineOpts = fn => ({
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'nearest', intersect: true },
        onClick: (e, els) => { if (els.length) fn(els[0].datasetIndex, els[0].index); },
        scales: { x: { ticks: { color: mc }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: mc, precision: 0 }, grid: { color: 'rgba(152,152,159,.15)' } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: tc } } }
      });
      chartInstances.allLine = new Chart(document.getElementById('allLineChart').getContext('2d'), {
        type: 'line',
        data: { labels: ml12, datasets: mods.map((t, i) => ({ label: modName[i], data: ml12.map(l => per[i].filter(x => x.m.month === l).length), borderColor: MOD_COL[i], backgroundColor: MOD_COL[i] + '33', tension: .35, pointRadius: 4, pointHoverRadius: 7, borderWidth: 2.5 }))
          .concat([{ label: 'Total', data: ml12.map(l => flat.filter(x => x.m.month === l).length), borderColor: tc, borderDash: [6, 5], tension: .35, pointRadius: 3, pointHoverRadius: 6, borderWidth: 2 }]) },
        options: lineOpts((di, ix) => { const l = ml12[ix]; openModal(mixedDetail(`${di >= 3 ? 'Total' : modName[di]} · ${l}`, flat.filter(x => x.m.month === l && (di >= 3 || x.t === mods[di])))); })
      });
      let dayLabel = allMonth !== 'all' ? allMonth : '', bk = -1;
      if (!dayLabel) flat.forEach(x => { if (x.m.month && x.m.monthKey > bk) { bk = x.m.monthKey; dayLabel = x.m.month; } });
      const inMo = flat.filter(x => x.m.date && x.m.month === dayLabel);
      const dkey = inMo.length ? inMo[0].m.monthKey : 0, dim = dkey ? new Date(Math.floor(dkey / 100), dkey % 100 + 1, 0).getDate() : 0;
      const dayArr = Array.from({ length: dim }, (_, i) => i + 1);
      document.getElementById('allDayLbl').textContent = `${dayLabel || '-'} · klik titik untuk detail`;
      chartInstances.allDay = new Chart(document.getElementById('allDayChart').getContext('2d'), {
        type: 'line',
        data: { labels: dayArr, datasets: mods.map((t, i) => ({ label: modName[i], data: dayArr.map(d => inMo.filter(x => x.t === t && x.m.date.getDate() === d).length), borderColor: MOD_COL[i], backgroundColor: MOD_COL[i] + '26', fill: true, tension: .3, pointRadius: 2.5, pointHoverRadius: 6, borderWidth: 2 })) },
        options: lineOpts((di, ix) => openModal(mixedDetail(`${modName[di]} · ${ix + 1} ${dayLabel}`, inMo.filter(x => x.t === mods[di] && x.m.date.getDate() === ix + 1))))
      });
      const obj = ent => Object.fromEntries(ent);
      renderChart('allDonMod', { OPS: of('ops').length, EMS: of('ems').length, PNR: pnrRows.length }, k => openModal(mixedDetail(`Entry ${k}`, of(k.toLowerCase()))));
      renderChart('allDonStatus', obj(countBy(pnrRows, x => x.m.status)), k => openModal(mixedDetail(`PNR ${k}`, pnrRows.filter(x => x.m.status === k))));
      renderChart('allDonStore', obj(countBy(sel, x => x.m.store).slice(0, 6)), k => openModal(mixedDetail(k, sel.filter(x => x.m.store === k))));
      renderChart('allDonHO', obj(countBy(sel, x => x.m.ho)), k => openModal(mixedDetail(`Area ${k}`, sel.filter(x => x.m.ho === k))));
      const ml = monthEntries(flat.map(x => x.m), true).map(e => e[0]).slice(-12);
      const colors = MOD_COL;
      chartInstances.allTrend = new Chart(document.getElementById('allTrendChart').getContext('2d'), {
        type: 'bar',
        data: { labels: ml, datasets: mods.map((t, i) => ({ label: t.toUpperCase(), data: ml.map(l => per[i].filter(x => x.m.month === l).length), backgroundColor: colors[i], borderRadius: 4 })) },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { color: mc }, grid: { display: false } },
            y: { stacked: true, beginAtZero: true, ticks: { color: mc, precision: 0 }, grid: { color: 'rgba(148,163,184,.15)' } }
          },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: tc } } }
        }
      });
    }

    /* ---------- Section expand / collapse ---------- */
    const csOpen = new Set();
    const resizeCharts = () => setTimeout(() => Object.values(chartInstances).forEach(c => { try { c.resize(); } catch (e) {} }), 80);
    function csWrap(el, title, tab) {
      if (!el || (el.parentNode && el.parentNode.classList && el.parentNode.classList.contains('cs'))) return;
      const k = tab + '|' + title, w = document.createElement('div');
      w.className = 'cs' + (csOpen.has(k) ? '' : ' collapsed'); w.dataset.k = k;
      w.innerHTML = `<button class="cs-head" onclick="toggleCs(this)"><span class="cs-title">${escapeHtml(title)}</span><span class="cs-act"><span class="cs-x">Expand</span><span class="cs-c">Collapse</span><i class="cs-chev"></i></span></button>`;
      el.before(w); w.appendChild(el);
    }
    function toggleCs(btn) {
      const w = btn.closest('.cs'), c = w.classList.toggle('collapsed');
      if (c) csOpen.delete(w.dataset.k); else csOpen.add(w.dataset.k);
      resizeCharts();
    }
    function csAll(tab, btn) {
      const ws = Array.from(document.querySelectorAll(`#panel-${tab} .cs`)), open = ws.some(w => w.classList.contains('collapsed'));
      ws.forEach(w => { w.classList.toggle('collapsed', !open); if (open) csOpen.add(w.dataset.k); else csOpen.delete(w.dataset.k); });
      if (btn) btn.textContent = open ? 'Collapse semua' : 'Expand semua';
      resizeCharts();
    }
    function csTitle(el) {
      if (el.dataset && el.dataset.title) return el.dataset.title;
      const t = el.querySelector('.panel-title') || el.querySelector('.sum-title');
      let x = t ? t.textContent.trim().replace(/\s*\(.*\)\s*$/, '') : '';
      if (!el.querySelector('.panel-title') && el.querySelector('.sum-cols')) x = el.querySelector('.capsules') ? 'Staff & Store Trainer Tanpa Aktivitas' : 'Peringkat Store, Staff & Topik';
      return x || 'Section';
    }
    function collapsify(host, tab) { // dipakai tab Summary (isi dirender ulang tiap refresh)
      Array.from(host.children).forEach(el => {
        if (el.classList.contains('filter-bar') || el.classList.contains('cs')) return;
        if (el.classList.contains('content-grid') || el.classList.contains('donut-grid')) Array.from(el.children).forEach(c => csWrap(c, csTitle(c), tab));
        else csWrap(el, csTitle(el), tab);
      });
    }

    /* ---------- Export .xls ---------- */
    const EXPORT_BTN = t => `<button class="btn-export" onclick="openExport('${t}')" title="Export data"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export</button>`;
    const CS_BTN = t => `<button class="btn-ghost" onclick="csAll('${t}',this)">Expand semua</button>`;
    let lastAllSel = [];
    const plain = c => String(c == null ? '' : c).replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&').trim();
    const detailPlain = (type, rows) => { const d = detailRows(type, rows); return { heads: d.heads, rows: d.rows.map(r => r.map(plain)) }; };
    function domSection(table, title) {
      if (!table) return { title, heads: [], rows: [] };
      return { title, heads: Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim()),
        rows: Array.from(table.querySelectorAll('tbody tr')).map(tr => Array.from(tr.children).map(td => td.textContent.trim())) };
    }
    function buildExport(tab) {
      const secs = [];
      if (tab === 'ops') {
        secs.push(domSection(document.getElementById('opsThead').closest('table'), 'Data Detail OPS per Store'));
        secs.push({ title: 'Data Entry OPS', ...detailPlain('ops', getFilteredData('ops')) });
      } else if (tab === 'ems') {
        secs.push({ title: 'Data Detail EMS', ...detailPlain('ems', getFilteredData('ems')) });
      } else if (tab === 'pnr') {
        secs.push({ title: 'Data Detail PNR', ...detailPlain('pnr', getFilteredData('pnr')) });
      } else {
        document.querySelectorAll('#panel-all .table-container table').forEach(t => {
          const c = t.closest('.panel-card'), ttl = c && c.querySelector('.sum-title');
          secs.push(domSection(t, ttl ? ttl.textContent.trim() : 'Tabel'));
        });
        const m = mixedDetail('Semua Entry', lastAllSel);
        secs.push({ title: 'Semua Entry', heads: m.heads, rows: m.rows.map(r => r.map(plain)) });
      }
      return secs.filter(x => x.heads.length);
    }
    function exportXls(filename, sections) {
      const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>${sections.map(x => `<table border="1"><tr><td colspan="${x.heads.length}" style="font-weight:bold;font-size:14pt">${esc(x.title)}</td></tr><tr>${x.heads.map(h => `<th style="background:#0a84ff;color:#ffffff">${esc(h)}</th>`).join('')}</tr>${x.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table><br>`).join('')}</body></html>`;
      const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    let exportTarget = null;
    function openExport(t) { exportTarget = t; document.getElementById('exportOv').classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeExport() { document.getElementById('exportOv').classList.remove('open'); document.body.style.overflow = ''; }
    function doExport(fmt) { const t = exportTarget; closeExport(); if (!t) return; if (fmt === 'pdf') exportPdf(t); else exportTab(t); }
    function exportPdf(tab) { // buka halaman cetak, pilih "Save as PDF" di dialog print
      const secs = buildExport(tab);
      if (!secs.length) { alert('Belum ada data untuk diexport.'); return; }
      const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const name = `Activity Performance Hub · ${tab.toUpperCase()}`;
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(name)}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:9px;color:#111}h1{font-size:15px;margin:0 0 2px}h2{font-size:12px;margin:16px 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:10px}th,td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}th{background:#0a84ff;color:#fff}tr{page-break-inside:avoid}thead{display:table-header-group}</style></head><body><h1>${esc(name)}</h1><div>${new Date().toLocaleDateString('id-ID')}</div>${secs.map(x => `<h2>${esc(x.title)}</h2><table><thead><tr>${x.heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${x.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`).join('')}</body></html>`;
      const w = window.open('', '_blank');
      if (w) { w.document.open(); w.document.write(html); w.document.close(); w.focus(); setTimeout(() => w.print(), 500); return; }
      const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
      document.body.appendChild(f); f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
      setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 3000); }, 500);
    }
    function exportTab(tab) {
      const secs = buildExport(tab);
      if (!secs.length) { alert('Belum ada data untuk diexport.'); return; }
      exportXls(`Activity-Performance-Hub_${tab.toUpperCase()}_${new Date().toISOString().slice(0, 10)}.xls`, secs);
    }

    /* ---------- GitHub Action (sync-data.yml) ---------- */
    const GH = { owner: 'steeshigeo', repo: 'Activity-Performance-Hub', wf: 'sync-data.yml', sheet: '1nSMZjGUWdKVXXn1EiYt95giow4_vDeSfP8KWovS0FF0', poll: 5000, reset: 4000 };
    let ghRunning = false;
    async function ghToken() { // token dibaca dari sheet kolom A2 hanya saat tombol ditekan, tidak disimpan
      const res = await fetch(`https://docs.google.com/spreadsheets/d/${GH.sheet}/gviz/tq?tqx=out:json&headers=0&gid=0&range=A2:A2&_=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Sheet token tidak bisa dibaca (HTTP ' + res.status + ')');
      let json;
      try { const txt = await res.text(); json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1)); }
      catch (e) { throw new Error('Sheet token tidak bisa dibaca, pastikan sheet bisa diakses via link'); }
      const c = json.table && json.table.rows[0] && json.table.rows[0].c[0];
      const t = c && c.v != null ? String(c.v).trim() : '';
      if (!t) throw new Error('Token di kolom A2 kosong');
      return t;
    }
    const ghErr = r => r.status === 401 || r.status === 403 ? 'Token ditolak GitHub (cek token aktif dan izin Actions: write)' : r.status === 404 ? 'Repo atau workflow tidak ditemukan / token tanpa akses ke repo' : `GitHub membalas HTTP ${r.status}`;
    async function runGithubAction() {
      if (ghRunning) return;
      if (!confirm('Run update data?')) return;
      ghRunning = true;
      const btn = document.getElementById('ghRunBtn');
      const setB = (pc, label, st) => { btn.style.setProperty('--p', pc + '%'); document.getElementById('settingsBtn').style.setProperty('--p', (pc >= 100 ? 0 : pc) + '%'); btn.querySelector('.lbl').textContent = label; btn.classList.toggle('done', st === 'done'); btn.classList.toggle('err', st === 'err'); };
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      btn.disabled = true; setB(8, 'Mengambil token…');
      try {
        const token = await ghToken();
        const api = `https://api.github.com/repos/${GH.owner}/${GH.repo}/actions/workflows/${GH.wf}`;
        const h = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
        const t0 = new Date(Date.now() - 20000);
        const dispatch = ref => fetch(`${api}/dispatches`, { method: 'POST', headers: { ...h, 'Content-Type': 'application/json' }, body: JSON.stringify({ ref }) });
        setB(15, 'Mengirim perintah 15%');
        let res = await dispatch('main');
        if (res.status === 422) res = await dispatch('master');
        if (res.status !== 204) throw new Error(ghErr(res));
        setB(25, 'Antre di GitHub 25%');
        let run = null;
        for (let i = 0; i < 60; i++) {
          await sleep(GH.poll);
          const r = await fetch(`${api}/runs?event=workflow_dispatch&per_page=5`, { headers: h });
          if (!r.ok) continue;
          const j = await r.json();
          run = (j.workflow_runs || []).find(x => new Date(x.created_at) >= t0) || null;
          if (!run) { setB(28, 'Menunggu run 28%'); continue; }
          if (run.status === 'completed') break;
          const pc = run.status === 'in_progress' ? Math.min(92, 45 + i * 3) : 32;
          setB(pc, `${run.status === 'in_progress' ? 'Berjalan' : 'Antre'} ${pc}%`);
        }
        if (!run || run.status !== 'completed') throw new Error('Run belum selesai, cek tab Actions di GitHub');
        if (run.conclusion !== 'success') throw new Error('Workflow selesai dengan status: ' + run.conclusion);
        setB(100, '✓ Sync selesai 100%', 'done');
        updateSyncStatus('GitHub Action berhasil', '');
        await fetchLatestData(); // muat data terbaru setelah sync
      } catch (err) {
        console.warn('GitHub Action gagal:', err.message);
        setB(100, 'Gagal', 'err'); updateSyncStatus(String(err.message || err), 'warn');
      }
      await sleep(GH.reset);
      btn.disabled = false; setB(0, 'Run Sync');
      ghRunning = false;
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const nt = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nt);
      try { localStorage.setItem('theme', nt); } catch (e) {}
      renderCurrentModule();
    });
    { const mb = document.getElementById('manualSyncBtn'); if (mb) mb.addEventListener('click', fetchLatestData); }

    document.addEventListener('DOMContentLoaded', () => {
      initSummaryHosts();
      fetchLatestData();
      setInterval(fetchLatestData, AUTO_REFRESH_INTERVAL);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchLatestData();
      });
    });
  </script>
</body>
