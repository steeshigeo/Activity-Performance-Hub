<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Performance Hub - Digimap</title>
  
  <!-- Chart.js & Google Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(30, 41, 59, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --card-bg: rgba(15, 23, 42, 0.65);
      --table-hover: rgba(56, 189, 248, 0.08);
      --input-bg: rgba(0, 0, 0, 0.25);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --card-bg: rgba(255, 255, 255, 0.75);
      --table-hover: rgba(2, 132, 199, 0.06);
      --input-bg: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 24px;
    }

    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .status-pill.syncing { color: #f59e0b; }
    .status-pill.online { color: #10b981; }
    .status-pill.offline { color: #ef4444; }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-icon:hover {
      background: var(--accent);
      color: #fff;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px;
    }

    .kpi-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .controls-row {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .search-box {
      flex: 1;
      padding: 10px 16px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-main);
      outline: none;
    }

    .select-box {
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .table-container {
      overflow-x: auto;
      max-height: 520px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th {
      background: var(--glass-bg);
      padding: 12px 16px;
      color: var(--text-muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--glass-border);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    tr:hover td {
      background: var(--table-hover);
    }

    /* Pagination Styles */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .pagination-buttons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .page-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .page-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .module-panel { display: none; }
    .module-panel.active { display: block; }
  </style>
</head>
<body>

  <div class="app-shell">
    <header>
      <div class="brand">
        <h1>Retail Performance Hub</h1>
        <p>Digimap Command Center Real-time Analytics</p>
      </div>

      <div class="header-actions">
        <div id="cloudStatusPill" class="status-pill syncing">
          <span>☁️ Memuat data...</span>
        </div>
        <button class="btn-icon" id="manualSyncBtn">↻ Sync Data</button>
        <button class="btn-icon" id="themeToggleBtn">🌓 Tema</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchModule('ops')">Module OPS</button>
      <button class="tab-btn" onclick="switchModule('ems')">Module EMS</button>
      <button class="tab-btn" onclick="switchModule('pnr')">Module PNR</button>
    </div>

    <!-- Modul OPS -->
    <div id="panel-ops" class="module-panel active">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total Entry OPS</div>
          <div class="kpi-value" id="ops-kpi-total">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Total Peserta Open Studio</div>
          <div class="kpi-value" id="ops-kpi-participants">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Total Unit Terjual</div>
          <div class="kpi-value" id="ops-kpi-units">0</div>
        </div>
      </div>

      <div class="content-grid">
        <div class="panel-card">
          <div class="panel-header">
            <div class="panel-title">Data Detail OPS</div>
          </div>
          <div class="controls-row">
            <input type="text" id="opsSearch" class="search-box" placeholder="Cari store, presenter, topik, dll..." oninput="onSearchInput('ops')">
            <select id="opsPageSize" class="select-box" onchange="onPageSizeChange('ops')">
              <option value="25">25 per hal</option>
              <option value="50" selected>50 per hal</option>
              <option value="100">100 per hal</option>
              <option value="500">500 per hal</option>
              <option value="all">Semua Data</option>
            </select>
          </div>
          <div class="table-container">
            <table>
              <thead><tr id="opsThead"></tr></thead>
              <tbody id="opsTbody"></tbody>
            </table>
          </div>
          <div class="pagination-bar" id="opsPagination"></div>
        </div>

        <div class="panel-card">
          <div class="panel-title">Topik Terpopuler</div>
          <canvas id="opsChart" height="260"></canvas>
        </div>
      </div>
    </div>

    <!-- Modul EMS -->
    <div id="panel-ems" class="module-panel">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total Entry EMS</div>
          <div class="kpi-value" id="ems-kpi-total">0</div>
        </div>
      </div>
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">Data Detail EMS</div>
        </div>
        <div class="controls-row">
          <input type="text" id="emsSearch" class="search-box" placeholder="Cari data EMS..." oninput="onSearchInput('ems')">
          <select id="emsPageSize" class="select-box" onchange="onPageSizeChange('ems')">
            <option value="25">25 per hal</option>
            <option value="50" selected>50 per hal</option>
            <option value="100">100 per hal</option>
            <option value="500">500 per hal</option>
            <option value="all">Semua Data</option>
          </select>
        </div>
        <div class="table-container">
          <table>
            <thead><tr id="emsThead"></tr></thead>
            <tbody id="emsTbody"></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="emsPagination"></div>
      </div>
    </div>

    <!-- Modul PNR -->
    <div id="panel-pnr" class="module-panel">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total Entry PNR</div>
          <div class="kpi-value" id="pnr-kpi-total">0</div>
        </div>
      </div>
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">Data Detail PNR</div>
        </div>
        <div class="controls-row">
          <input type="text" id="pnrSearch" class="search-box" placeholder="Cari data PNR..." oninput="onSearchInput('pnr')">
          <select id="pnrPageSize" class="select-box" onchange="onPageSizeChange('pnr')">
            <option value="25">25 per hal</option>
            <option value="50" selected>50 per hal</option>
            <option value="100">100 per hal</option>
            <option value="500">500 per hal</option>
            <option value="all">Semua Data</option>
          </select>
        </div>
        <div class="table-container">
          <table>
            <thead><tr id="pnrThead"></tr></thead>
            <tbody id="pnrTbody"></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="pnrPagination"></div>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxAAdUZ1LQfD6GOnGFf364ixUlyNT_FVwb2lZUcIi4sCSIBmmluz1KkyQlFIEPeWHipHA/exec";
    const SYNC_INTERVAL = 60000;

    let state = {
      ops: [],
      ems: [],
      pnr: [],
      activeModule: 'ops',
      pages: {
        ops: { page: 1, pageSize: 50, filter: '' },
        ems: { page: 1, pageSize: 50, filter: '' },
        pnr: { page: 1, pageSize: 50, filter: '' }
      }
    };

    let chartInstances = {};

    // Helper Membersihkan Nama Key Header
    function cleanHeaderName(str) {
      return String(str || '').replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // Helper Mengambil Value dengan Pencarian Keyword
    function getFlexibleValue(row, keywords) {
      const keys = Object.keys(row);
      for (const kw of keywords) {
        const matchKey = keys.find(k => cleanHeaderName(k).toLowerCase().includes(kw.toLowerCase()));
        if (matchKey && row[matchKey] !== undefined && row[matchKey] !== null && row[matchKey] !== '') {
          return row[matchKey];
        }
      }
      return null;
    }

    // 1. Core Fetch Engine
    async function fetchLatestData() {
      updateSyncStatus('syncing', '☁️ Synchronizing...');
      try {
        const res = await fetch(GAS_API_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('Network error');
        
        const data = await res.json();
        
        if (data.status === 'success' || data.sheets) {
          state.ops = data.sheets?.ops || data.ops || [];
          state.ems = data.sheets?.ems || data.ems || [];
          state.pnr = data.sheets?.pnr || data.pnr || [];
        } else if (Array.isArray(data)) {
          state.ops = data;
        }

        localStorage.setItem('cached_state', JSON.stringify({ ops: state.ops, ems: state.ems, pnr: state.pnr }));
        localStorage.setItem('last_sync', new Date().toISOString());

        renderCurrentModule();
        updateSyncStatus('online', `☁️ Data Sinkron (${new Date().toLocaleTimeString()})`);
      } catch (err) {
        console.warn('Sync failed, using cache:', err);
        const cached = localStorage.getItem('cached_state');
        if (cached) {
          const parsed = JSON.parse(cached);
          state.ops = parsed.ops || [];
          state.ems = parsed.ems || [];
          state.pnr = parsed.pnr || [];
          renderCurrentModule();
          updateSyncStatus('offline', '⚠️ Cache Mode (Offline)');
        } else {
          updateSyncStatus('offline', '⚠️ Gagal Terhubung');
        }
      }
    }

    // 2. Render Functions
    function renderCurrentModule() {
      if (state.activeModule === 'ops') renderOPS();
      if (state.activeModule === 'ems') renderEMS();
      if (state.activeModule === 'pnr') renderPNR();
    }

    function renderOPS() {
      const data = state.ops;
      document.getElementById('ops-kpi-total').textContent = data.length.toLocaleString('id-ID');

      let totalParticipants = 0;
      let totalUnits = 0;
      const topicCounts = {};

      data.forEach(row => {
        const partVal = getFlexibleValue(row, ['participant', 'peserta']);
        const unitVal = getFlexibleValue(row, ['unit yang terjual', 'unit terjual', 'terjual']);
        const topicVal = getFlexibleValue(row, ['topics', 'topik']) || 'Lainnya';

        const partNum = parseInt(partVal) || 0;
        const unitNum = parseInt(unitVal) || 0;

        totalParticipants += partNum;
        totalUnits += unitNum;
        topicCounts[topicVal] = (topicCounts[topicVal] || 0) + 1;
      });

      document.getElementById('ops-kpi-participants').textContent = totalParticipants.toLocaleString('id-ID');
      document.getElementById('ops-kpi-units').textContent = totalUnits.toLocaleString('id-ID');

      renderTableWithPagination('ops', data);
      renderChart('opsChart', topicCounts);
    }

    function renderEMS() {
      document.getElementById('ems-kpi-total').textContent = state.ems.length.toLocaleString('id-ID');
      renderTableWithPagination('ems', state.ems);
    }

    function renderPNR() {
      document.getElementById('pnr-kpi-total').textContent = state.pnr.length.toLocaleString('id-ID');
      renderTableWithPagination('pnr', state.pnr);
    }

    // Konsolidasi Semua Header Unik
    function getAllHeaders(data) {
      const headersSet = new Set();
      data.forEach(row => {
        Object.keys(row).forEach(k => headersSet.add(k));
      });
      return Array.from(headersSet);
    }

    // Render Table + Pagination Logic
    function renderTableWithPagination(type, rawData) {
      const pState = state.pages[type];
      const query = pState.filter.toLowerCase();

      // Filter Data
      const filtered = rawData.filter(row => {
        if (!query) return true;
        return Object.values(row).some(val => String(val || '').toLowerCase().includes(query));
      });

      const totalItems = filtered.length;
      const pageSize = pState.pageSize === 'all' ? totalItems : parseInt(pState.pageSize);
      const totalPages = Math.ceil(totalItems / (pageSize || 1)) || 1;

      if (pState.page > totalPages) pState.page = totalPages;
      if (pState.page < 1) pState.page = 1;

      const startIndex = (pState.page - 1) * pageSize;
      const paginatedData = pState.pageSize === 'all' ? filtered : filtered.slice(startIndex, startIndex + pageSize);

      const thead = document.getElementById(`${type}Thead`);
      const tbody = document.getElementById(`${type}Tbody`);

      if (totalItems === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td style="text-align:center; padding:24px;">Data tidak ditemukan.</td></tr>';
        renderPaginationControls(type, 0, 0, 0, 0);
        return;
      }

      const headers = getAllHeaders(rawData);

      // Header dengan nama bersih
      thead.innerHTML = headers.map(h => `<th title="${h}">${cleanHeaderName(h)}</th>`).join('');

      // Body
      tbody.innerHTML = paginatedData.map(row => {
        return `<tr>${headers.map(h => {
          let val = row[h];
          if (val === undefined || val === null || val === '') val = '-';
          return `<td>${val}</td>`;
        }).join('')}</tr>`;
      }).join('');

      renderPaginationControls(type, totalItems, pState.page, totalPages, paginatedData.length);
    }

    function renderPaginationControls(type, totalItems, currentPage, totalPages, currentDisplayed) {
      const container = document.getElementById(`${type}Pagination`);
      if (!container) return;

      if (totalItems === 0) {
        container.innerHTML = '<span>Menampilkan 0 data</span>';
        return;
      }

      const start = (currentPage - 1) * (state.pages[type].pageSize === 'all' ? totalItems : parseInt(state.pages[type].pageSize)) + 1;
      const end = start + currentDisplayed - 1;

      let btnsHtml = `
        <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage('${type}', ${currentPage - 1})">◄ Prev</button>
        <span style="margin: 0 8px; font-weight: 600;">Hal ${currentPage} dari ${totalPages}</span>
        <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage('${type}', ${currentPage + 1})">Next ►</button>
      `;

      container.innerHTML = `
        <div>Menampilkan <strong>${start} - ${end}</strong> dari <strong>${totalItems.toLocaleString('id-ID')}</strong> total data</div>
        <div class="pagination-buttons">${btnsHtml}</div>
      `;
    }

    function changePage(type, newPage) {
      state.pages[type].page = newPage;
      renderCurrentModule();
    }

    function onSearchInput(type) {
      state.pages[type].filter = document.getElementById(`${type}Search`).value;
      state.pages[type].page = 1;
      renderCurrentModule();
    }

    function onPageSizeChange(type) {
      state.pages[type].pageSize = document.getElementById(`${type}PageSize`).value;
      state.pages[type].page = 1;
      renderCurrentModule();
    }

    function renderChart(canvasId, topicCounts) {
      if (chartInstances[canvasId]) {
        chartInstances[canvasId].destroy();
      }

      const sortedTopics = Object.entries(topicCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);

      const labels = sortedTopics.map(item => item[0]);
      const values = sortedTopics.map(item => item[1]);

      const ctx = document.getElementById(canvasId).getContext('2d');
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185', '#34d399']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { 
              position: 'bottom', 
              labels: { 
                boxWidth: 12,
                color: getComputedStyle(document.body).getPropertyValue('--text-main') 
              } 
            }
          }
        }
      });
    }

    function switchModule(mod) {
      state.activeModule = mod;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`panel-${mod}`).classList.add('active');
      renderCurrentModule();
    }

    function updateSyncStatus(type, msg) {
      const el = document.getElementById('cloudStatusPill');
      el.className = `status-pill ${type}`;
      el.innerHTML = `<span>${msg}</span>`;
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      renderCurrentModule();
    });

    document.getElementById('manualSyncBtn').addEventListener('click', fetchLatestData);

    document.addEventListener('DOMContentLoaded', () => {
      fetchLatestData();
      setInterval(fetchLatestData, SYNC_INTERVAL);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchLatestData();
      });
    });
  </script>
</body>
</html>
