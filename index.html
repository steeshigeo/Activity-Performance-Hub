<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Performance Hub - Digimap</title>
  
  <!-- Chart.js & Google Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --card-bg: rgba(15, 23, 42, 0.6);
      --table-hover: rgba(56, 189, 248, 0.08);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --card-bg: rgba(255, 255, 255, 0.7);
      --table-hover: rgba(2, 132, 199, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 24px;
    }

    /* Container Glass Panel */
    .app-shell {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* Header & Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill.syncing { color: #f59e0b; }
    .status-pill.online { color: #10b981; }
    .status-pill.offline { color: #ef4444; }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .btn-icon:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Modul Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px;
    }

    .kpi-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Layout Content & Chart */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Search & Table */
    .search-box {
      width: 100%;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-main);
      margin-bottom: 16px;
      outline: none;
    }

    .table-container {
      overflow-x: auto;
      max-height: 420px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      background: var(--glass-bg);
      padding: 12px 16px;
      color: var(--text-muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    tr:hover td {
      background: var(--table-hover);
    }

    .module-panel { display: none; }
    .module-panel.active { display: block; }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Header -->
    <header>
      <div class="brand">
        <h1>Retail Performance Hub</h1>
        <p>Digimap Command Center Real-time Analytics</p>
      </div>

      <div class="header-actions">
        <div id="cloudStatusPill" class="status-pill syncing">
          <span>☁️ Memuat data...</span>
        </div>
        <button class="btn-icon" id="manualSyncBtn">↻ Sync</button>
        <button class="btn-icon" id="themeToggleBtn">🌓 Tema</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchModule('ops')">Module OPS</button>
      <button class="tab-btn" onclick="switchModule('ems')">Module EMS</button>
      <button class="tab-btn" onclick="switchModule('pnr')">Module PNR</button>
    </div>

    <!-- Modul OPS -->
    <div id="panel-ops" class="module-panel active">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total Respon OPS</div>
          <div class="kpi-value" id="ops-kpi-total">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Total Peserta</div>
          <div class="kpi-value" id="ops-kpi-participants">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Unit Terjual</div>
          <div class="kpi-value" id="ops-kpi-units">0</div>
        </div>
      </div>

      <div class="content-grid">
        <div class="panel-card">
          <div class="panel-title">Data Detail OPS</div>
          <input type="text" id="opsSearch" class="search-box" placeholder="Cari store, presenter, atau topik..." oninput="filterTable('ops')">
          <div class="table-container">
            <table id="opsTable">
              <thead><tr id="opsThead"></tr></thead>
              <tbody id="opsTbody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-title">Topik Terpopuler</div>
          <canvas id="opsChart" height="250"></canvas>
        </div>
      </div>
    </div>

    <!-- Modul EMS -->
    <div id="panel-ems" class="module-panel">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total Entry EMS</div>
          <div class="kpi-value" id="ems-kpi-total">0</div>
        </div>
      </div>
      <div class="panel-card">
        <div class="panel-title">Data Detail EMS</div>
        <input type="text" id="emsSearch" class="search-box" placeholder="Cari data EMS..." oninput="filterTable('ems')">
        <div class="table-container">
          <table id="emsTable">
            <thead><tr id="emsThead"></tr></thead>
            <tbody id="emsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modul PNR -->
    <div id="panel-pnr" class="module-panel">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Total Entry PNR</div>
          <div class="kpi-value" id="pnr-kpi-total">0</div>
        </div>
      </div>
      <div class="panel-card">
        <div class="panel-title">Data Detail PNR</div>
        <input type="text" id="pnrSearch" class="search-box" placeholder="Cari data PNR..." oninput="filterTable('pnr')">
        <div class="table-container">
          <table id="pnrTable">
            <thead><tr id="pnrThead"></tr></thead>
            <tbody id="pnrTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* API URL Apps Script Kamu */
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxAAdUZ1LQfD6GOnGFf364ixUlyNT_FVwb2lZUcIi4sCSIBmmluz1KkyQlFIEPeWHipHA/exec";
    const SYNC_INTERVAL = 60000; // 60 Detik

    let state = {
      ops: [],
      ems: [],
      pnr: [],
      activeModule: 'ops'
    };

    let chartInstances = {};

    // 1. Core Fetch Engine
    async function fetchLatestData() {
      updateSyncStatus('syncing', '☁️ Synchronizing...');
      try {
        const res = await fetch(GAS_API_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('Network error');
        
        const data = await res.json();
        
        // Ambil data dari payload Apps Script
        if (data.status === 'success' || data.sheets) {
          state.ops = data.sheets?.ops || data.ops || [];
          state.ems = data.sheets?.ems || data.ems || [];
          state.pnr = data.sheets?.pnr || data.pnr || [];
        } else if (Array.isArray(data)) {
          state.ops = data; // Fallback jika format array langsung
        }

        // Cache ke local storage
        localStorage.setItem('cached_state', JSON.stringify(state));
        localStorage.setItem('last_sync', new Date().toISOString());

        renderCurrentModule();
        updateSyncStatus('online', `☁️ Updated (${new Date().toLocaleTimeString()})`);
      } catch (err) {
        console.warn('Sync failed, fallback to cache:', err);
        const cached = localStorage.getItem('cached_state');
        if (cached) {
          state = JSON.parse(cached);
          renderCurrentModule();
          updateSyncStatus('offline', '⚠️ Offline Mode (Cached)');
        } else {
          updateSyncStatus('offline', '⚠️ Gagal memuat data');
        }
      }
    }

    // 2. Render UI Controls
    function renderCurrentModule() {
      if (state.activeModule === 'ops') renderOPS();
      if (state.activeModule === 'ems') renderEMS();
      if (state.activeModule === 'pnr') renderPNR();
    }

    function renderOPS() {
      const data = state.ops;
      document.getElementById('ops-kpi-total').textContent = data.length;

      // Hitung KPI opsional jika kolom tersedia
      let totalParticipants = 0;
      let totalUnits = 0;
      const topicCounts = {};

      data.forEach(row => {
        // Ambil nilai berdasarkan perkiraan nama kolom
        const part = parseInt(row["Total Participants\nBerapa banyak pelanggan yang mengikuti sesi Open Studio"] || row["Total Participants"] || 0);
        const unit = parseInt(row["Unit yang terjual setelah Open Studio"] || 0);
        const topic = row["Open Studio Topics"] || row["Topic"] || "Lainnya";

        if (!isNaN(part)) totalParticipants += part;
        if (!isNaN(unit)) totalUnits += unit;
        topicCounts[topic] = (topicCounts[topic] || 0) + 1;
      });

      document.getElementById('ops-kpi-participants').textContent = totalParticipants;
      document.getElementById('ops-kpi-units').textContent = totalUnits;

      renderTable('ops', data);
      renderChart('opsChart', topicCounts);
    }

    function renderEMS() {
      document.getElementById('ems-kpi-total').textContent = state.ems.length;
      renderTable('ems', state.ems);
    }

    function renderPNR() {
      document.getElementById('pnr-kpi-total').textContent = state.pnr.length;
      renderTable('pnr', state.pnr);
    }

    // Helper Dynamic Table
    function renderTable(type, data) {
      const thead = document.getElementById(`${type}Thead`);
      const tbody = document.getElementById(`${type}Tbody`);

      if (!data || data.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td style="text-align:center; padding:20px;">Tidak ada data tersedia</td></tr>';
        return;
      }

      const headers = Object.keys(data[0]);
      thead.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

      tbody.innerHTML = data.slice(0, 50).map(row => {
        return `<tr>${headers.map(h => `<td>${row[h] !== undefined ? row[h] : '-'}</td>`).join('')}</tr>`;
      }).join('');
    }

    // Filter Table Search
    function filterTable(type) {
      const query = document.getElementById(`${type}Search`).value.toLowerCase();
      const rawData = state[type];
      
      const filtered = rawData.filter(row => {
        return Object.values(row).some(val => String(val).toLowerCase().includes(query));
      });

      renderTable(type, filtered);
    }

    // Helper Chart.js
    function renderChart(canvasId, topicCounts) {
      if (chartInstances[canvasId]) {
        chartInstances[canvasId].destroy();
      }

      const labels = Object.keys(topicCounts).slice(0, 5);
      const values = Object.values(topicCounts).slice(0, 5);

      const ctx = document.getElementById(canvasId).getContext('2d');
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom', labels: { color: getComputedStyle(document.body).getPropertyValue('--text-main') } }
          }
        }
      });
    }

    // 3. Navigation & Theme Handler
    function switchModule(mod) {
      state.activeModule = mod;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`panel-${mod}`).classList.add('active');
      renderCurrentModule();
    }

    function updateSyncStatus(type, msg) {
      const el = document.getElementById('cloudStatusPill');
      el.className = `status-pill ${type}`;
      el.innerHTML = `<span>${msg}</span>`;
    }

    // Theme Switcher
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      renderCurrentModule();
    });

    document.getElementById('manualSyncBtn').addEventListener('click', fetchLatestData);

    // 4. Auto Sync Listeners
    document.addEventListener('DOMContentLoaded', () => {
      fetchLatestData();
      setInterval(fetchLatestData, SYNC_INTERVAL);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchLatestData();
      });
    });
  </script>
</body>
</html>
