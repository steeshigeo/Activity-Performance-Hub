<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Performance Hub - Digimap</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--glass-bg:rgba(30,41,59,.75);--glass-border:rgba(255,255,255,.1);--text-main:#f8fafc;--text-muted:#94a3b8;--accent:#38bdf8;--card-bg:rgba(15,23,42,.65);--table-hover:rgba(56,189,248,.08);--input-bg:rgba(0,0,0,.25);--opt-bg:#1e293b}
    [data-theme="light"]{--bg-gradient:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--glass-bg:rgba(255,255,255,.88);--glass-border:rgba(0,0,0,.08);--text-main:#0f172a;--text-muted:#64748b;--accent:#0284c7;--card-bg:rgba(255,255,255,.75);--table-hover:rgba(2,132,199,.06);--input-bg:rgba(255,255,255,.9);--opt-bg:#fff}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;transition:background-color .25s ease,color .25s ease}
    body{background:var(--bg-gradient);min-height:100vh;color:var(--text-main);padding:24px}
    .app-shell{max-width:1440px;margin:0 auto;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:24px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
    .brand h1{font-size:1.5rem;font-weight:700;letter-spacing:-.5px}
    .brand p{font-size:.85rem;color:var(--text-muted)}
    .header-actions{display:flex;align-items:center;gap:12px}
    .status-pill{font-size:.8rem;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:#10b981;font-weight:500}
    .btn-icon{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-main);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.85rem}
    .btn-icon:hover{background:var(--accent);color:#fff}
    .nav-tabs{display:flex;gap:8px;background:var(--card-bg);padding:6px;border-radius:16px;border:1px solid var(--glass-border);margin-bottom:24px}
    .tab-btn{flex:1;padding:10px 16px;border:none;background:transparent;color:var(--text-muted);font-weight:600;border-radius:10px;cursor:pointer;text-align:center}
    .tab-btn.active{background:var(--accent);color:#fff}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
    .kpi-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:16px;padding:18px}
    .kpi-title{font-size:.8rem;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
    .kpi-value{font-size:1.8rem;font-weight:700}
    .content-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}
    @media(max-width:1024px){.content-grid{grid-template-columns:1fr}}
    .panel-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:16px;padding:20px;min-width:0}
    .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    .panel-title{font-size:1.05rem;font-weight:600}
    .controls-row{display:flex;gap:12px;align-items:center;width:100%;margin-bottom:16px;flex-wrap:wrap}
    .search-box{flex:2;min-width:180px;padding:10px 16px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-main);outline:none}
    .select-box{flex:1;min-width:150px;padding:10px 14px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-main);outline:none;cursor:pointer}
    .select-box option,.select-box optgroup{background:var(--opt-bg);color:var(--text-main)}
    .table-container{overflow-x:auto;max-height:520px;border-radius:12px;border:1px solid var(--glass-border)}
    table{width:100%;border-collapse:collapse;text-align:left;font-size:.85rem;white-space:nowrap}
    th{background:var(--opt-bg);padding:12px 16px;color:var(--text-muted);font-weight:600;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--glass-border)}
    td{padding:12px 16px;border-bottom:1px solid var(--glass-border)}
    tr:hover td{background:var(--table-hover)}
    .pagination-bar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--text-muted)}
    .pagination-buttons{display:flex;gap:6px;align-items:center}
    .page-btn{padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-main);border-radius:8px;cursor:pointer;font-size:.8rem}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .module-panel{display:none}.module-panel.active{display:block}
  
    .header-actions{flex-wrap:wrap}
    .status-pill,.btn-icon{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;line-height:1;white-space:nowrap}
    .btn-icon:disabled{opacity:.65;cursor:wait}
    .btn-icon.loading span{display:inline-block;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-pill.loading{color:var(--accent)}
    .status-pill.warn{color:#f59e0b}
    .content-grid{align-items:stretch}
    .content-grid>.panel-card:last-child{display:flex;flex-direction:column}
    .chart-wrap{position:relative;flex:1;min-height:280px}
    .chart-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
    .muted{color:var(--text-muted)}
    .sum-wrap{margin-bottom:24px}
    .sum-wrap .kpi-value{font-size:1.4rem}
    .sum-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .sum-title{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin-bottom:8px}
    .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-track{height:8px;border-radius:99px;background:var(--input-bg);overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:var(--accent)}
    .bar-val{font-weight:600}
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand"><h1>Retail Performance Hub</h1><p>Digimap Command Center Real-time Analytics</p></div>
      <div class="header-actions">
        <div id="cloudStatusPill" class="status-pill"><span>☁️ Updated</span></div>
        <button class="btn-icon" id="manualSyncBtn">↻ Refresh</button>
        <button class="btn-icon" id="themeToggleBtn">🌓 Tema</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchModule('ops',this)">Module OPS</button>
      <button class="tab-btn" onclick="switchModule('ems',this)">Module EMS</button>
      <button class="tab-btn" onclick="switchModule('pnr',this)">Module PNR</button>
      <button class="tab-btn" onclick="switchModule('all',this)">Summary</button>
    </div>

    <div id="panel-ops" class="module-panel active">
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-title">Total Entry OPS</div><div class="kpi-value" id="ops-kpi-total">0</div></div>
        <div class="kpi-card"><div class="kpi-title">Total Peserta Open Studio</div><div class="kpi-value" id="ops-kpi-participants">0</div></div>
        <div class="kpi-card"><div class="kpi-title">Total Unit Terjual</div><div class="kpi-value" id="ops-kpi-units">0</div></div>
      </div>
      <div class="content-grid">
        <div class="panel-card">
          <div class="panel-header"><div class="panel-title">Data Detail OPS</div></div>
          <div class="controls-row">
            <input type="text" id="opsSearch" class="search-box" placeholder="Cari kata kunci..." oninput="onSearchInput('ops')">
            <select id="opsMonthFilter" class="select-box" onchange="onFilterChange('ops','month')"></select>
            <select id="opsTrainerHOFilter" class="select-box" onchange="onFilterChange('ops','trainerHO')"></select>
            <select id="opsStoreFilter" class="select-box" onchange="onFilterChange('ops','store')"></select>
            <select id="opsTrainerFilter" class="select-box" onchange="onFilterChange('ops','trainer')"></select>
          </div>
          <div class="table-container"><table><thead><tr id="opsThead"></tr></thead><tbody id="opsTbody"></tbody></table></div>
          <div class="pagination-bar" id="opsPagination"></div>
        </div>
        <div class="panel-card">
          <div class="panel-title">Topik Terpopuler</div>
          <div class="chart-wrap"><canvas id="opsChart"></canvas></div>
        </div>
      </div>
    </div>

    <div id="panel-ems" class="module-panel">
      <div class="kpi-grid"><div class="kpi-card"><div class="kpi-title">Total Entry EMS</div><div class="kpi-value" id="ems-kpi-total">0</div></div></div>
      <div class="panel-card">
        <div class="panel-header"><div class="panel-title">Data Detail EMS</div></div>
        <div class="controls-row">
          <input type="text" id="emsSearch" class="search-box" placeholder="Cari data EMS..." oninput="onSearchInput('ems')">
          <select id="emsMonthFilter" class="select-box" onchange="onFilterChange('ems','month')"></select>
          <select id="emsTrainerHOFilter" class="select-box" onchange="onFilterChange('ems','trainerHO')"></select>
          <select id="emsStoreFilter" class="select-box" onchange="onFilterChange('ems','store')"></select>
          <select id="emsTrainerFilter" class="select-box" onchange="onFilterChange('ems','trainer')"></select>
        </div>
        <div class="table-container"><table><thead><tr id="emsThead"></tr></thead><tbody id="emsTbody"></tbody></table></div>
        <div class="pagination-bar" id="emsPagination"></div>
      </div>
    </div>

    <div id="panel-pnr" class="module-panel">
      <div class="kpi-grid"><div class="kpi-card"><div class="kpi-title">Total Entry PNR</div><div class="kpi-value" id="pnr-kpi-total">0</div></div></div>
      <div class="panel-card">
        <div class="panel-header"><div class="panel-title">Data Detail PNR</div></div>
        <div class="controls-row">
          <input type="text" id="pnrSearch" class="search-box" placeholder="Cari data PNR..." oninput="onSearchInput('pnr')">
          <select id="pnrMonthFilter" class="select-box" onchange="onFilterChange('pnr','month')"></select>
          <select id="pnrTrainerHOFilter" class="select-box" onchange="onFilterChange('pnr','trainerHO')"></select>
          <select id="pnrStoreFilter" class="select-box" onchange="onFilterChange('pnr','store')"></select>
          <select id="pnrTrainerFilter" class="select-box" onchange="onFilterChange('pnr','trainer')"></select>
        </div>
        <div class="table-container"><table><thead><tr id="pnrThead"></tr></thead><tbody id="pnrTbody"></tbody></table></div>
        <div class="pagination-bar" id="pnrPagination"></div>
      </div>
    </div>
  </div>

  <script>
    const DATA_JSON_URL = "./data/data.json";
    // Sheet "Recap" = data master (Store, Trainer HO, Nama Trainer/Presenter). Dibaca ulang setiap refresh.
    const RECAP_SHEET_URL = "https://docs.google.com/spreadsheets/d/1_lvhYAt2RozrhqMWCzFVvm8bCPm4yunnYcie4nM55U4/gviz/tq?tqx=out:json&sheet=Recap";
    const AUTO_REFRESH_INTERVAL = 300000;
    const PAGE_SIZE = 50;
    const MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let recapMasterData = [];   // [{store, nama, email, position, trainerHO}]
    let storeIndex = new Map(); // norm(store) -> {name, ho}
    let state = {
      ops: [], ems: [], pnr: [], activeModule: 'ops',
      pages: {
        ops: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' },
        ems: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' },
        pnr: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' }
      }
    };
    let chartInstances = {};

    const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim();
    const NO_HO = 'Tanpa Trainer HO';

    function formatDateTime(dateInput) {
      if (!dateInput) return '';
      const date = new Date(dateInput);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).replace('.', ':');
    }

    function cleanHeaderName(str) {
      if (!str) return '';
      let clean = String(str).replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
      const lower = clean.toLowerCase();
      if (lower.includes('presenter name') || lower.includes('fill in your full name') || lower.includes('trainer name')) return 'Presenter';
      if (lower.includes('tanggal (') || lower.includes('tanggal ( hari')) return 'Tanggal Sesi';
      if (lower.includes('total participants') || lower.includes('berapa banyak pelanggan')) return 'Total Peserta';
      if (lower.includes('unit yang terjual')) return 'Unit Terjual';
      if (lower.includes('produk apa yang pelanggan minati') || lower.includes('pelanggan minati')) return 'Produk Minat';
      if (lower.includes('open studio topics')) return 'Topik Open Studio';
      if (lower.includes('report photo')) return 'Foto Laporan';
      if (lower.includes('timestamp') || lower.includes('waktu input')) return 'Waktu Input';
      if (clean.length > 22) clean = clean.split('(')[0].split(':')[0].trim();
      return clean;
    }

    function getFlexibleValue(row, keywords) {
      if (!row) return null;
      const keys = Object.keys(row);
      for (const kw of keywords) {
        const matchKey = keys.find(k => String(k).toLowerCase().includes(kw.toLowerCase()));
        if (matchKey && row[matchKey] !== undefined && row[matchKey] !== null) {
          const val = String(row[matchKey]).trim();
          if (val !== '' && val !== '-' && val !== '0') return val;
        }
      }
      return null;
    }

    /* ---------- Data master (sheet Recap) ---------- */
    function buildStoreIndex() {
      storeIndex = new Map();
      recapMasterData.forEach(r => {
        const k = norm(r.store);
        if (!k) return;
        let cur = storeIndex.get(k);
        if (!cur) { cur = { name: r.store, ho: r.trainerHO || '', trainers: new Set() }; storeIndex.set(k, cur); }
        else if (!cur.ho && r.trainerHO) cur.ho = r.trainerHO;
        // Store Trainer = kolom "Store Trainer" bila ada, atau staff di store itu yang posisinya Trainer
        const st = r.storeTrainer || (/trainer/i.test(r.position) ? r.nama : '');
        if (st && st !== '0') cur.trainers.add(st);
      });
    }

    function parseRecap(text) {
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const cols = (json.table?.cols || []).map(c => (c.label || '').trim());
      let rows = (json.table?.rows || []).map(r => (r.c || []).map(c => (c && c.v != null) ? String(c.v).trim() : ''));
      let headers = cols;
      // Jika Google tidak mendeteksi header, baris pertama dipakai sebagai header
      if (!cols.some(Boolean) && rows.length) headers = rows.shift();

      const find = (re, exclude, fallback) => {
        const i = headers.findIndex((h, idx) => !exclude.includes(idx) && re.test(String(h).toLowerCase()));
        return i >= 0 ? i : fallback;
      };
      const iST = find(/store\s*trainer|trainer\s*store/, [], -1);
      const iHO = find(/trainer\s*ho|ho\s*trainer|\bho\b/, [iST], 9);
      const iStore = find(/store|toko|cabang/, [iHO, iST], 1);
      const iNama = find(/nama|name|presenter|trainer/, [iHO, iStore, iST], 2);
      const iEmail = find(/email|e-mail/, [iHO, iStore, iNama, iST], 4);
      const iPos = find(/position|posisi|jabatan/, [iHO, iStore, iNama, iEmail, iST], 5);

      return rows.map(c => ({
        store: c[iStore] || '', nama: c[iNama] || '', email: c[iEmail] || '',
        position: c[iPos] || '', trainerHO: c[iHO] || '', storeTrainer: c[iST] || ''
      })).filter(r => r.store && r.store !== '0').map(r => {
        if (r.trainerHO === '0') r.trainerHO = '';
        if (r.nama === '0') r.nama = '';
        return r;
      });
    }

    async function fetchRecapMasterData() {
      try {
        const res = await fetch(RECAP_SHEET_URL + '&_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        recapMasterData = parseRecap(await res.text());
        localStorage.setItem('recap_cache', JSON.stringify(recapMasterData));
      } catch (err) {
        console.warn('Sheet Recap gagal dibaca, pakai cache:', err);
        try { recapMasterData = JSON.parse(localStorage.getItem('recap_cache') || '[]'); } catch (e) { recapMasterData = []; }
      }
      buildStoreIndex();
    }

    /* ---------- Metadata per baris aktivitas ---------- */
    function getRowStore(row) {
      const raw = getFlexibleValue(row, ['store', 'toko', 'cabang', 'location', 'lokasi']);
      if (!raw) return null;
      const m = storeIndex.get(norm(raw));
      return m ? m.name : raw;
    }

    function getRowTrainer(row) {
      return getFlexibleValue(row, ['trainer', 'presenter', 'nama trainer', 'nama presenter', 'staff', 'nama', 'nps', 'participants name']);
    }

    function monthKeyFromLabel(label) {
      const mi = MONTH_NAMES_ID.findIndex(n => label.toLowerCase().includes(n.toLowerCase()));
      const y = (label.match(/\b(19|20)\d{2}\b/) || [])[0];
      return mi >= 0 && y ? parseInt(y) * 100 + mi : 0;
    }

    const MONTH_NAMES_EN = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    function monthFromText(low) {
      for (let i = 0; i < 12; i++) {
        if (new RegExp('\\b(' + MONTH_NAMES_ID[i].toLowerCase() + '|' + MONTH_NAMES_EN[i] + ')\\b').test(low)) return i;
      }
      return -1;
    }
    function parseAnyDate(v) {
      const s = String(v).trim(), low = s.toLowerCase();
      let m = s.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/);
      if (m) return new Date(+m[1], +m[2], +m[3]);
      const yr = low.match(/\b((?:19|20)\d{2})\b/), mi = monthFromText(low);
      if (mi >= 0 && yr) return new Date(+yr[1], mi, 1);
      m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]); // dd/mm/yyyy
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }
    function getRowMonthInfo(row) {
      const direct = getFlexibleValue(row, ['bulan', 'month']);
      const cands = [direct, ...['tanggal', 'date', 'waktu', 'timestamp'].map(k => getFlexibleValue(row, [k]))];
      for (const v of cands) {
        if (!v) continue;
        const d = parseAnyDate(v);
        if (d && d.getFullYear() > 1990) return { label: `${MONTH_NAMES_ID[d.getMonth()]} ${d.getFullYear()}`, key: d.getFullYear() * 100 + d.getMonth() };
      }
      return direct ? { label: direct, key: monthKeyFromLabel(direct) } : null;
    }

    function getRowMeta(row) {
      const store = getRowStore(row);
      const mi = getRowMonthInfo(row);
      const idx = store ? storeIndex.get(norm(store)) : null;
      return {
        store: store || '',
        trainer: getRowTrainer(row) || '',
        month: mi ? mi.label : '',
        monthKey: mi ? mi.key : 0,
        ho: idx ? idx.ho : '', st: idx ? Array.from(idx.trainers) : []
      };
    }

    /* ---------- Dropdown berkelompok & saling terhubung ---------- */
    function groupBy(items, keyFn) {
      const g = new Map();
      items.forEach(it => { const k = keyFn(it); if (!g.has(k)) g.set(k, []); g.get(k).push(it); });
      return g;
    }
    const byName = (a, b) => a.localeCompare(b, 'id', { numeric: true, sensitivity: 'base' });

    function renderSelect(id, defaultText, groups, current) {
      const el = document.getElementById(id);
      if (!el) return;
      const esc = escapeHtml;
      let html = `<option value="all">${defaultText}</option>`;
      const labels = Array.from(groups.keys()).sort((a, b) => (a === NO_HO) - (b === NO_HO) || byName(a, b));
      const useGroups = labels.length > 1 || (labels.length === 1 && labels[0] !== NO_HO && groups.get(labels[0]).length > 0 && groups.__grouped);
      labels.forEach(label => {
        const opts = groups.get(label).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
        html += groups.__grouped ? `<optgroup label="${esc(label)}">${opts}</optgroup>` : opts;
      });
      el.innerHTML = html;
      el.value = current;
      if (el.value !== current) el.value = 'all';
    }

    function populateDropdowns(type) {
      const p = state.pages[type];
      const isPNR = type === 'pnr'; // PNR: filter grup = Store Trainer, modul lain = Trainer HO
      const metas = (state[type] || []).map(getRowMeta);
      const el = id => document.getElementById(`${type}${id}`);

      // Bulan + tahun, terbaru dulu
      const months = new Map();
      metas.forEach(m => { if (m.month) months.set(m.month, m.monthKey); });
      const monthList = Array.from(months.entries()).sort((a, b) => b[1] - a[1] || byName(a[0], b[0])).map(e => e[0]);
      renderSelect(`${type}MonthFilter`, '📅 Semua Bulan', new Map([['_', monthList]]), p.month);
      p.month = el('MonthFilter').value;

      // Semua store (master Recap + store yang muncul di aktivitas)
      const stores = new Map();
      storeIndex.forEach((v, k) => stores.set(k, { name: v.name, ho: v.ho, trainers: v.trainers }));
      metas.forEach(m => { if (m.store && !stores.has(norm(m.store))) stores.set(norm(m.store), { name: m.store, ho: '', trainers: new Set() }); });
      const inGroup = (s, v) => v === 'all' || (isPNR ? s.trainers.has(v) : s.ho === v);

      // Trainer HO / Store Trainer
      const groupSet = new Set();
      stores.forEach(s => { if (isPNR) s.trainers.forEach(t => groupSet.add(t)); else if (s.ho) groupSet.add(s.ho); });
      renderSelect(`${type}TrainerHOFilter`, isPNR ? '🏷️ Semua Store Trainer' : '👔 Semua Trainer HO',
        new Map([['_', Array.from(groupSet).sort(byName)]]), p.trainerHO);
      p.trainerHO = el('TrainerHOFilter').value;

      // Store, dikelompokkan per Trainer HO (PNR: per Store Trainer)
      const storeList = Array.from(stores.values()).filter(s => inGroup(s, p.trainerHO)).sort((a, b) => byName(a.name, b.name));
      const sg = groupBy(storeList, s => isPNR ? (Array.from(s.trainers).sort(byName).join(', ') || 'Tanpa Store Trainer') : (s.ho || NO_HO));
      sg.forEach((arr, k) => sg.set(k, arr.map(s => s.name)));
      sg.__grouped = true;
      renderSelect(`${type}StoreFilter`, '🏪 Semua Store', sg, p.store);
      p.store = el('StoreFilter').value;

      // Staff / Presenter, dikelompokkan per Store
      const staff = new Map();
      const addStaff = (name, store) => {
        if (!name || name === '0') return;
        const idx = storeIndex.get(norm(store));
        const storeName = idx ? idx.name : store;
        const s = stores.get(norm(storeName)) || { ho: '', trainers: new Set() };
        if (!inGroup(s, p.trainerHO)) return;
        if (p.store !== 'all' && norm(storeName) !== norm(p.store)) return;
        const k = norm(storeName) + '|' + norm(name);
        if (!staff.has(k)) staff.set(k, { name, store: storeName || 'Tanpa Store' });
      };
      recapMasterData.forEach(r => addStaff(r.nama, r.store));
      metas.forEach(m => addStaff(m.trainer, m.store));
      const tg = groupBy(Array.from(staff.values()).sort((a, b) => byName(a.name, b.name)), t => t.store);
      tg.forEach((arr, k) => tg.set(k, arr.map(t => t.name)));
      tg.__grouped = true;
      renderSelect(`${type}TrainerFilter`, '👤 Semua Staff', tg, p.trainer);
      p.trainer = el('TrainerFilter').value;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- Ambil data aktivitas (OPS / EMS / PNR) ---------- */
    async function _fetchLatestData() {
      const lastSync = localStorage.getItem('last_sync');
      const fallbackTime = lastSync ? formatDateTime(lastSync) : formatDateTime(new Date());

      await fetchRecapMasterData();

      try {
        const res = await fetch(DATA_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('File data.json tidak ditemukan');
        const data = await res.json();

        if (data.status === 'success' || data.sheets) {
          state.ops = data.sheets?.ops || data.ops || [];
          state.ems = data.sheets?.ems || data.ems || [];
          state.pnr = data.sheets?.pnr || data.pnr || [];
        } else if (Array.isArray(data)) {
          state.ops = data;
        }
        const syncTimestamp = data.last_updated || new Date().toISOString();
        try {
          localStorage.setItem('cached_state', JSON.stringify({ ops: state.ops, ems: state.ems, pnr: state.pnr }));
          localStorage.setItem('last_sync', syncTimestamp);
        } catch (e) {}
        refreshAll();
        updateSyncStatus(`☁️ Updated: ${formatDateTime(syncTimestamp)}`);
      } catch (err) {
        console.warn('Membaca data dari cache lokal:', err);
        const cached = localStorage.getItem('cached_state');
        if (cached) {
          const parsed = JSON.parse(cached);
          state.ops = parsed.ops || [];
          state.ems = parsed.ems || [];
          state.pnr = parsed.pnr || [];
          refreshAll();
        }
        updateSyncStatus(`⚠️ Offline, pakai cache: ${fallbackTime}`, 'warn');
      }
    }

    function refreshAll() {
      ['ops', 'ems', 'pnr'].forEach(populateDropdowns);
      renderCurrentModule();
    }

    function renderCurrentModule() {
      if (state.activeModule === 'ops') renderOPS();
      if (state.activeModule === 'ems') renderEMS();
      if (state.activeModule === 'pnr') renderPNR();
      if (state.activeModule === 'all') renderAllSummary();
    }

    function getFilteredData(type) {
      const rawData = state[type] || [];
      const p = state.pages[type];
      const q = (p.filter || '').toLowerCase();

      return rawData.filter(row => {
        const m = getRowMeta(row);
        if (p.month !== 'all' && m.month !== p.month) return false;
        if (p.trainerHO !== 'all' && !(type === 'pnr' ? m.st.includes(p.trainerHO) : m.ho === p.trainerHO)) return false;
        if (p.store !== 'all' && norm(m.store) !== norm(p.store)) return false;
        if (p.trainer !== 'all') {
          const a = norm(m.trainer), b = norm(p.trainer);
          if (!a || !(a === b || a.includes(b) || b.includes(a))) return false;
        }
        if (q && !Object.values(row).some(v => String(v || '').toLowerCase().includes(q))) return false;
        return true;
      });
    }

    function renderOPS() {
      const filteredData = getFilteredData('ops');
      document.getElementById('ops-kpi-total').textContent = filteredData.length.toLocaleString('id-ID');
      let totalParticipants = 0, totalUnits = 0;
      const topicCounts = {};
      filteredData.forEach(row => {
        totalParticipants += parseInt(getFlexibleValue(row, ['participant', 'peserta'])) || 0;
        totalUnits += parseInt(getFlexibleValue(row, ['unit yang terjual', 'unit terjual', 'terjual'])) || 0;
        const topicVal = getFlexibleValue(row, ['topics', 'topik']) || 'Lainnya';
        topicCounts[topicVal] = (topicCounts[topicVal] || 0) + 1;
      });
      document.getElementById('ops-kpi-participants').textContent = totalParticipants.toLocaleString('id-ID');
      document.getElementById('ops-kpi-units').textContent = totalUnits.toLocaleString('id-ID');
      renderTableWithPagination('ops', filteredData);
      renderModuleSummary('ops', filteredData, [
        ['Rata-rata Peserta / Sesi', filteredData.length ? (totalParticipants / filteredData.length).toFixed(1).replace('.', ',') : '0'],
        ['Unit Terjual / Peserta', totalParticipants ? (totalUnits / totalParticipants).toFixed(2).replace('.', ',') : '0']
      ]);
      renderChart('opsChart', topicCounts);
    }

    function renderEMS() {
      const d = getFilteredData('ems');
      document.getElementById('ems-kpi-total').textContent = d.length.toLocaleString('id-ID');
      renderTableWithPagination('ems', d);
      renderModuleSummary('ems', d);
    }

    function renderPNR() {
      const d = getFilteredData('pnr');
      document.getElementById('pnr-kpi-total').textContent = d.length.toLocaleString('id-ID');
      renderTableWithPagination('pnr', d);
      renderModuleSummary('pnr', d);
    }

    function getAllHeaders(data) {
      const s = new Set();
      data.forEach(row => Object.keys(row).forEach(k => s.add(k)));
      return Array.from(s);
    }

    function renderTableWithPagination(type, filteredData) {
      const p = state.pages[type];
      const totalItems = filteredData.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;
      if (p.page > totalPages) p.page = totalPages;
      if (p.page < 1) p.page = 1;

      const startIndex = (p.page - 1) * PAGE_SIZE;
      const paginatedData = filteredData.slice(startIndex, startIndex + PAGE_SIZE);
      const thead = document.getElementById(`${type}Thead`);
      const tbody = document.getElementById(`${type}Tbody`);

      if (totalItems === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td style="text-align:center; padding:24px;">Data tidak ditemukan untuk kombinasi filter ini.</td></tr>';
        renderPaginationControls(type, 0, 0, 0, 0);
        return;
      }

      const headers = ['__bulan', ...getAllHeaders(state[type])];
      thead.innerHTML = headers.map(h => `<th title="${escapeHtml(h)}">${escapeHtml(h === '__bulan' ? 'Bulan' : cleanHeaderName(h))}</th>`).join('');
      tbody.innerHTML = paginatedData.map(row =>
        `<tr>${headers.map(h => {
          let val = h === '__bulan' ? getRowMeta(row).month : row[h];
          if (val === undefined || val === null || val === '') val = '-';
          return `<td>${escapeHtml(val)}</td>`;
        }).join('')}</tr>`
      ).join('');
      renderPaginationControls(type, totalItems, p.page, totalPages, paginatedData.length);
    }

    function renderPaginationControls(type, totalItems, currentPage, totalPages, currentDisplayed) {
      const c = document.getElementById(`${type}Pagination`);
      if (!c) return;
      if (totalItems === 0) { c.innerHTML = '<span>Menampilkan 0 data</span>'; return; }
      const start = (currentPage - 1) * PAGE_SIZE + 1;
      const end = start + currentDisplayed - 1;
      c.innerHTML = `
        <div>Menampilkan <strong>${start} - ${end}</strong> dari <strong>${totalItems.toLocaleString('id-ID')}</strong> data terfilter</div>
        <div class="pagination-buttons">
          <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage('${type}', ${currentPage - 1})">◄ Prev</button>
          <span style="margin:0 8px;font-weight:600;">Hal ${currentPage} dari ${totalPages}</span>
          <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage('${type}', ${currentPage + 1})">Next ►</button>
        </div>`;
    }

    function changePage(type, newPage) { state.pages[type].page = newPage; renderCurrentModule(); }

    function onSearchInput(type) {
      state.pages[type].filter = document.getElementById(`${type}Search`).value;
      state.pages[type].page = 1;
      renderCurrentModule();
    }

    function onFilterChange(type, key) {
      const id = `${type}${key.charAt(0).toUpperCase() + key.slice(1)}Filter`;
      state.pages[type][key] = document.getElementById(id).value;
      state.pages[type].page = 1;
      populateDropdowns(type); // dropdown lain ikut menyesuaikan (HO -> Store -> Trainer)
      renderCurrentModule();
    }

    function renderChart(canvasId, topicCounts) {
      if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
      const sorted = Object.entries(topicCounts).sort((a, b) => b[1] - a[1]).slice(0, 6);
      const ctx = document.getElementById(canvasId).getContext('2d');
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: sorted.map(i => i[0]),
          datasets: [{ data: sorted.map(i => i[1]), backgroundColor: ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185', '#34d399'] }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: getComputedStyle(document.body).getPropertyValue('--text-main') } } }
        }
      });
    }

    function switchModule(mod, btn) {
      state.activeModule = mod;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${mod}`).classList.add('active');
      renderCurrentModule();
    }

    function updateSyncStatus(msg, cls = '') {
      const pill = document.getElementById('cloudStatusPill');
      pill.className = 'status-pill ' + cls;
      pill.innerHTML = `<span>${msg}</span>`;
    }

    /* ---------- Summary ---------- */
    let isLoading = false;
    async function fetchLatestData() {
      if (isLoading) return;
      isLoading = true;
      const btn = document.getElementById('manualSyncBtn');
      btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = '<span>↻</span> Memuat…';
      updateSyncStatus('⏳ Memuat data…', 'loading');
      try { await _fetchLatestData(); }
      finally {
        isLoading = false; btn.disabled = false; btn.classList.remove('loading'); btn.innerHTML = '<span>↻</span> Refresh';
      }
    }

    function initSummaryHosts() {
      ['ops', 'ems', 'pnr'].forEach(t => {
        const d = document.createElement('div');
        d.id = `${t}-summary`; d.className = 'panel-card sum-wrap';
        document.querySelector(`#panel-${t} .kpi-grid`).after(d);
      });
      const p = document.createElement('div');
      p.id = 'panel-all'; p.className = 'module-panel';
      document.querySelector('.app-shell').appendChild(p);
    }

    function countBy(items, fn) {
      const m = new Map();
      items.forEach(x => { const k = fn(x); if (k) m.set(k, (m.get(k) || 0) + 1); });
      return Array.from(m.entries()).sort((a, b) => b[1] - a[1] || byName(a[0], b[0]));
    }
    function monthEntries(metas, asc) {
      const m = new Map();
      metas.forEach(x => {
        if (!x.month) return;
        const e = m.get(x.month) || { n: 0, k: x.monthKey };
        e.n++; m.set(x.month, e);
      });
      return Array.from(m.entries()).sort((a, b) => asc ? a[1].k - b[1].k : b[1].k - a[1].k).map(([l, e]) => [l, e.n]);
    }
    function barList(title, entries, limit) {
      const list = entries.slice(0, limit || 5);
      const max = Math.max(1, ...list.map(e => e[1]));
      const rows = list.map(([k, v]) => `<div class="bar-row"><span class="bar-label" title="${escapeHtml(k)}">${escapeHtml(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div><span class="bar-val">${v.toLocaleString('id-ID')}</span></div>`).join('');
      return `<div class="sum-block"><div class="sum-title">${title}</div>${rows || '<div class="muted">Belum ada data</div>'}</div>`;
    }
    const kpiCard = (t, v, s) => `<div class="kpi-card"><div class="kpi-title">${t}</div><div class="kpi-value">${typeof v === 'number' ? v.toLocaleString('id-ID') : v}</div>${s ? `<div class="muted" style="font-size:.75rem;margin-top:4px">${s}</div>` : ''}</div>`;

    function renderModuleSummary(type, data, extras) {
      const el = document.getElementById(`${type}-summary`);
      if (!el) return;
      const metas = data.map(getRowMeta);
      const stores = new Set(metas.map(m => m.store).filter(Boolean));
      const staff = new Set(metas.map(m => norm(m.trainer)).filter(Boolean));
      const months = monthEntries(metas);
      const avg = stores.size ? (data.length / stores.size).toFixed(1).replace('.', ',') : '0';
      el.innerHTML = `<div class="panel-title" style="margin-bottom:14px">Summary ${type.toUpperCase()}</div>
        <div class="kpi-grid">
          ${kpiCard('Store Aktif', stores.size, storeIndex.size ? `dari ${storeIndex.size} store terdaftar` : '')}
          ${kpiCard('Staff Aktif', staff.size)}
          ${kpiCard('Bulan Tercakup', months.length)}
          ${kpiCard('Rata-rata Entry / Store', avg)}
          ${(extras || []).map(e => kpiCard(e[0], e[1])).join('')}
        </div>
        <div class="sum-cols">
          ${barList('Entry per Bulan', months, 6)}
          ${barList('Top 5 Store', countBy(metas, m => m.store))}
          ${barList('Top 5 Staff', countBy(metas, m => m.trainer))}
        </div>`;
    }

    let allMonth = 'all';
    function renderAllSummary() {
      const host = document.getElementById('panel-all');
      if (!host) return;
      if (chartInstances.allTrend) { chartInstances.allTrend.destroy(); delete chartInstances.allTrend; }
      const mods = ['ops', 'ems', 'pnr'];
      const per = mods.map(t => (state[t] || []).map(r => ({ t, r, m: getRowMeta(r) })));
      const flat = [].concat(...per);
      const monthLabels = monthEntries(flat.map(x => x.m)).map(e => e[0]);
      if (allMonth !== 'all' && !monthLabels.includes(allMonth)) allMonth = 'all';
      const sel = allMonth === 'all' ? flat : flat.filter(x => x.m.month === allMonth);
      const stores = new Set(sel.map(x => x.m.store).filter(Boolean));
      const staff = new Set(sel.map(x => norm(x.m.trainer)).filter(Boolean));
      let part = 0, units = 0;
      sel.filter(x => x.t === 'ops').forEach(x => {
        part += parseInt(getFlexibleValue(x.r, ['participant', 'peserta'])) || 0;
        units += parseInt(getFlexibleValue(x.r, ['unit yang terjual', 'unit terjual', 'terjual'])) || 0;
      });
      const cnt = t => sel.filter(x => x.t === t).length;
      const idle = Array.from(storeIndex.values()).filter(s => !stores.has(s.name)).map(s => s.name).sort(byName);
      const idleHtml = !storeIndex.size ? 'Data Recap belum terbaca.' :
        idle.length ? escapeHtml(idle.slice(0, 12).join(', ')) + (idle.length > 12 ? ` +${idle.length - 12} lainnya` : '') : 'Semua store sudah punya aktivitas 🎉';

      host.innerHTML = `
        <div class="panel-card sum-wrap">
          <div class="panel-header">
            <div class="panel-title">Summary Keseluruhan (OPS + EMS + PNR)</div>
            <select class="select-box" style="flex:none;min-width:200px" onchange="allMonth=this.value;renderAllSummary()">
              <option value="all">📅 Semua Bulan</option>
              ${monthLabels.map(l => `<option value="${escapeHtml(l)}" ${l === allMonth ? 'selected' : ''}>${escapeHtml(l)}</option>`).join('')}
            </select>
          </div>
          <div class="kpi-grid" style="margin-bottom:0">
            ${kpiCard('Total Entry', sel.length)}
            ${kpiCard('Entry OPS', cnt('ops'))}
            ${kpiCard('Entry EMS', cnt('ems'))}
            ${kpiCard('Entry PNR', cnt('pnr'))}
            ${kpiCard('Store Aktif', stores.size, storeIndex.size ? `dari ${storeIndex.size} store terdaftar` : '')}
            ${kpiCard('Staff Aktif', staff.size)}
            ${kpiCard('Peserta Open Studio', part)}
            ${kpiCard('Unit Terjual', units)}
          </div>
        </div>
        <div class="panel-card sum-wrap">
          <div class="panel-title" style="margin-bottom:12px">Tren Entry per Bulan (12 bulan terakhir)</div>
          <div class="chart-wrap" style="height:300px;flex:none;min-height:0"><canvas id="allTrendChart"></canvas></div>
        </div>
        <div class="panel-card sum-wrap">
          <div class="sum-cols">
            ${barList('Top 5 Store', countBy(sel, x => x.m.store))}
            ${barList('Top 5 Staff', countBy(sel, x => x.m.trainer))}
            ${barList('Entry per Trainer HO', countBy(sel, x => x.m.ho))}
            ${barList('Entry per Bulan', monthEntries(sel.map(x => x.m)), 6)}
            <div class="sum-block"><div class="sum-title">Store Belum Ada Aktivitas (${idle.length})</div><div class="muted" style="font-size:.82rem;line-height:1.6">${idleHtml}</div></div>
          </div>
        </div>`;

      const root = getComputedStyle(document.documentElement);
      const tc = root.getPropertyValue('--text-main').trim(), mc = root.getPropertyValue('--text-muted').trim();
      const ml = monthEntries(flat.map(x => x.m), true).map(e => e[0]).slice(-12);
      const colors = ['#38bdf8', '#c084fc', '#34d399'];
      chartInstances.allTrend = new Chart(document.getElementById('allTrendChart').getContext('2d'), {
        type: 'bar',
        data: { labels: ml, datasets: mods.map((t, i) => ({ label: t.toUpperCase(), data: ml.map(l => per[i].filter(x => x.m.month === l).length), backgroundColor: colors[i] })) },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { color: mc }, grid: { display: false } },
            y: { stacked: true, beginAtZero: true, ticks: { color: mc, precision: 0 }, grid: { color: 'rgba(148,163,184,.15)' } }
          },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: tc } } }
        }
      });
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
      renderCurrentModule();
    });
    document.getElementById('manualSyncBtn').addEventListener('click', fetchLatestData);

    document.addEventListener('DOMContentLoaded', () => {
      initSummaryHosts();
      fetchLatestData();
      setInterval(fetchLatestData, AUTO_REFRESH_INTERVAL);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchLatestData();
      });
    });
  </script>
</body>
</html>
