<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Performance Hub - Digimap</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--glass-bg:rgba(30,41,59,.75);--glass-border:rgba(255,255,255,.1);--text-main:#f8fafc;--text-muted:#94a3b8;--accent:#38bdf8;--card-bg:rgba(15,23,42,.65);--table-hover:rgba(56,189,248,.08);--input-bg:rgba(0,0,0,.25);--opt-bg:#1e293b}
    [data-theme="light"]{--bg-gradient:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--glass-bg:rgba(255,255,255,.88);--glass-border:rgba(0,0,0,.08);--text-main:#0f172a;--text-muted:#64748b;--accent:#0284c7;--card-bg:rgba(255,255,255,.75);--table-hover:rgba(2,132,199,.06);--input-bg:rgba(255,255,255,.9);--opt-bg:#fff}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;transition:background-color .25s ease,color .25s ease}
    body{background:var(--bg-gradient);min-height:100vh;color:var(--text-main);padding:24px}
    .app-shell{max-width:1440px;margin:0 auto;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:24px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
    .brand h1{font-size:1.5rem;font-weight:700;letter-spacing:-.5px}
    .brand p{font-size:.85rem;color:var(--text-muted)}
    .header-actions{display:flex;align-items:center;gap:12px}
    .status-pill{font-size:.8rem;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:#10b981;font-weight:500}
    .btn-icon{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-main);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.85rem}
    .btn-icon:hover{background:var(--accent);color:#fff}
    .nav-tabs{display:flex;gap:8px;background:var(--card-bg);padding:6px;border-radius:16px;border:1px solid var(--glass-border);margin-bottom:24px}
    .tab-btn{flex:1;padding:10px 16px;border:none;background:transparent;color:var(--text-muted);font-weight:600;border-radius:10px;cursor:pointer;text-align:center}
    .tab-btn.active{background:var(--accent);color:#fff}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
    .kpi-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:16px;padding:18px}
    .kpi-title{font-size:.8rem;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
    .kpi-value{font-size:1.8rem;font-weight:700}
    .content-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}
    @media(max-width:1024px){.content-grid{grid-template-columns:1fr}}
    .panel-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:16px;padding:20px;min-width:0}
    .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    .panel-title{font-size:1.05rem;font-weight:600}
    .controls-row{display:flex;gap:12px;align-items:center;width:100%;margin-bottom:16px;flex-wrap:wrap}
    .search-box{flex:2;min-width:180px;padding:10px 16px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-main);outline:none}
    .select-box{flex:1;min-width:150px;padding:10px 14px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-main);outline:none;cursor:pointer}
    .select-box option,.select-box optgroup{background:var(--opt-bg);color:var(--text-main)}
    .table-container{overflow-x:auto;max-height:520px;border-radius:12px;border:1px solid var(--glass-border)}
    table{width:100%;border-collapse:collapse;text-align:left;font-size:.85rem;white-space:nowrap}
    th{background:var(--opt-bg);padding:12px 16px;color:var(--text-muted);font-weight:600;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--glass-border)}
    td{padding:12px 16px;border-bottom:1px solid var(--glass-border)}
    tr:hover td{background:var(--table-hover)}
    .pagination-bar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--text-muted)}
    .pagination-buttons{display:flex;gap:6px;align-items:center}
    .page-btn{padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-main);border-radius:8px;cursor:pointer;font-size:.8rem}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .module-panel{display:none}.module-panel.active{display:block}
  
    .header-actions{flex-wrap:wrap}
    .status-pill,.btn-icon{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;line-height:1;white-space:nowrap}
    .btn-icon:disabled{opacity:.65;cursor:wait}
    .btn-icon.loading span{display:inline-block;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-pill.loading{color:var(--accent)}
    .status-pill.warn{color:#f59e0b}
    .content-grid{align-items:stretch}
    .content-grid>.panel-card:last-child{display:flex;flex-direction:column}
    .chart-wrap{position:relative;flex:1;min-height:280px}
    .chart-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
    .muted{color:var(--text-muted)}
    .sum-wrap{margin-bottom:24px}
    .sum-wrap .kpi-value{font-size:1.4rem}
    .sum-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .sum-title{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin-bottom:8px}
    .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-track{height:8px;border-radius:99px;background:var(--input-bg);overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:var(--accent)}
    .bar-val{font-weight:600}
  
    body{background:var(--bg-gradient) fixed}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(620px 320px at 8% -4%,rgba(56,189,248,.18),transparent),radial-gradient(520px 320px at 96% 0,rgba(129,140,248,.17),transparent)}
    .app-shell{position:relative;z-index:1}
    .brand h1{background:linear-gradient(90deg,var(--text-main),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
    .status-pill{padding:0 16px 0 14px;background:var(--card-bg);font-size:.78rem;font-weight:600;letter-spacing:.2px}
    .status-pill::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;border-radius:99px;cursor:pointer;color:#fff;font-weight:700;font-size:.85rem;background:linear-gradient(135deg,#38bdf8,#6366f1);box-shadow:0 6px 18px rgba(99,102,241,.35);transition:transform .15s ease,box-shadow .15s ease,opacity .2s}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(99,102,241,.5)}
    .btn-primary:active{transform:translateY(0)}
    .btn-primary:disabled{opacity:.75;cursor:wait;transform:none}
    .btn-primary.loading svg{animation:spin .9s linear infinite}
    .btn-theme{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;cursor:pointer;color:var(--text-main);background:var(--card-bg);border:1px solid var(--glass-border)}
    .btn-theme:hover{color:var(--accent);border-color:var(--accent)}
    [data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
    .nav-tabs{overflow-x:auto;scrollbar-width:none}
    .tab-btn{white-space:nowrap;padding:10px 20px}
    .tab-btn.active{background:linear-gradient(135deg,var(--accent),#6366f1);box-shadow:0 4px 14px rgba(99,102,241,.35)}
    .kpi-card{transition:transform .15s ease,border-color .15s ease}
    .kpi-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .chips{display:flex;gap:6px}
    .chip{padding:5px 12px;border-radius:99px;border:1px solid var(--glass-border);background:transparent;color:var(--text-muted);font-size:.75rem;font-weight:600;cursor:pointer}
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .live-badge{font-size:.75rem;font-weight:600;color:#10b981}
    .roster th,.roster td{white-space:nowrap}
    .roster th:nth-child(1),.roster td:nth-child(1){position:sticky;left:0;min-width:240px;background:var(--opt-bg);z-index:1}
    .roster th:nth-child(2),.roster td:nth-child(2){position:sticky;left:240px;min-width:130px;background:var(--opt-bg);z-index:1}
    .roster th:nth-child(-n+2){z-index:3}
    .roster th.dc{text-align:center;padding:8px 6px;line-height:1.25;min-width:38px}
    .roster td.sh{text-align:center;font-weight:700;padding:8px 6px}
    .roster .today{box-shadow:inset 0 0 0 1px var(--accent)}
    .roster th.today{color:var(--accent)}
    .sh-e{background:rgba(52,211,153,.2);color:#10b981}.sh-m{background:rgba(251,191,36,.2);color:#d97706}
    .sh-l{background:rgba(129,140,248,.22);color:#6366f1}.sh-x{background:rgba(148,163,184,.18);color:var(--text-muted)}
  
    .nav-tabs{position:sticky;top:10px;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .btn-primary{position:relative;overflow:hidden;min-width:150px;justify-content:center}
    .btn-primary .fill{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:rgba(255,255,255,.32);transition:width .35s ease;pointer-events:none}
    .btn-primary svg,.btn-primary .lbl{position:relative}
    .btn-primary.loading svg{animation:none}
    .btn-primary.done{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 6px 18px rgba(16,185,129,.4)}
    .clickable{cursor:pointer}
    .bar-row.clickable:hover{background:var(--table-hover);border-radius:8px}
    tr.clickable:hover td{background:var(--table-hover)}
    tr.totrow td{font-weight:700;background:var(--table-hover)}
    .modal-ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.62);backdrop-filter:blur(4px)}
    .modal-ov.open{display:flex}
    .modal{width:min(1100px,94vw);max-height:86vh;display:flex;flex-direction:column;background:var(--opt-bg);border:1px solid var(--glass-border);border-radius:20px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
    .modal-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
    .modal-t{font-size:1.1rem;font-weight:700}
    .modal .table-container{flex:1;min-height:0;max-height:none}
    .badge{padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:700}
    .b-plan{background:rgba(251,191,36,.18);color:#d97706}.b-del{background:rgba(16,185,129,.18);color:#10b981}
    .b-man{background:rgba(244,63,94,.16);color:#f43f5e}.b-oth{background:rgba(56,189,248,.18);color:var(--accent)}
    .pct{font-weight:700}.pct.g{color:#10b981}.pct.a{color:#d97706}.pct.r{color:#f43f5e}
    .pbar{display:inline-block;width:60px;height:6px;border-radius:99px;background:var(--input-bg);vertical-align:middle;margin-left:8px;overflow:hidden}
    .pbar i{display:block;height:100%;background:var(--accent)}
    .matrix th,.matrix td{white-space:nowrap}
    .matrix th:nth-child(1),.matrix td:nth-child(1){position:sticky;left:0;min-width:200px;background:var(--opt-bg);z-index:1}
    .matrix th:nth-child(2),.matrix td:nth-child(2){position:sticky;left:200px;min-width:170px;background:var(--opt-bg);z-index:1}
    .matrix th:nth-child(-n+2){z-index:3}
    .matrix th.dc{text-align:center;padding:6px 4px;min-width:34px;line-height:1.2;font-size:.72rem}
    .matrix th.wk{color:#f43f5e}.matrix .today{box-shadow:inset 0 0 0 1px var(--accent)}
    .matrix td.mx{text-align:center;padding:6px 4px}
    .matrix td.on{background:rgba(56,189,248,.22);color:var(--accent);font-weight:700;cursor:pointer}
    .matrix td.mxt,.matrix tfoot td{font-weight:700;text-align:center}
    .av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;margin-right:10px;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#38bdf8,#6366f1);flex:none}
    .tcell{display:flex;align-items:center}
    .wa-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff!important;font-weight:700;font-size:.75rem;text-decoration:none;box-shadow:0 4px 12px rgba(37,211,102,.3);transition:transform .15s}
    .wa-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:.78rem}
    .roster td.sh{padding:6px 4px}
    .cap-grid,.rapor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .cap{border-radius:16px;padding:14px 16px;border:1px solid var(--glass-border);background:var(--card-bg);cursor:pointer;transition:transform .15s,border-color .15s}
    .cap:hover{transform:translateY(-3px);border-color:var(--accent)}
    .cap .v{font-size:1.6rem;font-weight:800;margin:2px 0}
    .cap .l{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
    .cap.e{border-left:4px solid #10b981}.cap.m{border-left:4px solid #f59e0b}.cap.l2{border-left:4px solid #6366f1}.cap.x{border-left:4px solid #94a3b8}
    .mod-card{border-radius:16px;padding:16px;border:1px solid var(--glass-border);background:var(--card-bg);cursor:pointer;transition:transform .15s,border-color .15s}
    .mod-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .mod-card .v{font-size:1.7rem;font-weight:800}
    .mod-card .ln{font-size:.78rem;color:var(--text-muted);margin-top:4px}
  
    /* ===== LUXURY THEME ===== */
    :root{--bg-gradient:linear-gradient(160deg,#08080a 0%,#121215 55%,#0b0b0d 100%);--glass-bg:rgba(18,18,21,.86);--glass-border:rgba(201,169,110,.2);--text-main:#f4efe6;--text-muted:#a29b8d;--accent:#c9a96e;--card-bg:rgba(255,255,255,.028);--table-hover:rgba(201,169,110,.08);--input-bg:rgba(255,255,255,.045);--opt-bg:#17171a}
    [data-theme="light"]{--bg-gradient:linear-gradient(160deg,#f8f4ec 0%,#ece4d4 100%);--glass-bg:rgba(255,253,248,.92);--glass-border:rgba(120,90,40,.22);--text-main:#1c1812;--text-muted:#7a7263;--accent:#8a6d2f;--card-bg:rgba(255,255,255,.72);--table-hover:rgba(138,109,47,.08);--input-bg:rgba(255,255,255,.9);--opt-bg:#fffdf8}
    body{padding:28px 20px}
    body::before{background:radial-gradient(700px 360px at 6% -6%,rgba(201,169,110,.16),transparent),radial-gradient(560px 340px at 98% 0,rgba(201,169,110,.09),transparent)}
    .app-shell{border-radius:22px;padding:30px;border:1px solid var(--glass-border);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
    .brand h1,.panel-title,.kpi-value,.cap .v,.mod-card .v,.modal-t{font-family:'Cormorant Garamond','Playfair Display',Georgia,serif!important;letter-spacing:.2px}
    .brand h1{font-size:2.3rem;font-weight:600;background:linear-gradient(90deg,#f1e2bd,var(--accent) 55%,#a8843f);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
    [data-theme="light"] .brand h1{background:linear-gradient(90deg,#5c4519,#8a6d2f 60%,#b08a3e);-webkit-background-clip:text;background-clip:text}
    .brand p{font-size:.68rem;letter-spacing:.42em;text-transform:uppercase;color:var(--text-muted);margin-top:6px}
    header{padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid var(--glass-border)}
    .status-pill{border-radius:99px;background:transparent;border:1px solid var(--glass-border);text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;color:var(--accent)}
    .status-pill.loading{color:var(--accent)}.status-pill.warn{color:#d9a441}
    .status-pill::before{animation:pulseG 2.2s infinite}
    @keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(201,169,110,.55)}70%{box-shadow:0 0 0 7px rgba(201,169,110,0)}100%{box-shadow:0 0 0 0 rgba(201,169,110,0)}}
    .btn-primary{border-radius:99px;color:#1b1407;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;font-weight:700;background:linear-gradient(135deg,#ecd9a8 0%,#c9a96e 50%,#a8843f 100%);box-shadow:0 8px 24px rgba(201,169,110,.28)}
    .btn-primary:hover{box-shadow:0 10px 30px rgba(201,169,110,.45)}
    .btn-primary .fill{background:rgba(255,255,255,.4)}
    .btn-primary.done{background:linear-gradient(135deg,#3fae86,#2a7d5f);color:#fff;box-shadow:0 8px 24px rgba(42,125,95,.35)}
    .btn-theme{background:transparent;border:1px solid var(--glass-border);color:var(--accent)}
    .btn-theme:hover{background:var(--accent);color:#1b1407}
    .nav-tabs{background:rgba(10,10,12,.55);border:1px solid var(--glass-border);border-radius:14px;padding:6px;gap:4px}
    [data-theme="light"] .nav-tabs{background:rgba(255,253,248,.8)}
    .tab-btn{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border-radius:10px;padding:12px 18px;color:var(--text-muted)}
    .tab-btn:hover{color:var(--text-main)}
    .tab-btn.active{background:linear-gradient(135deg,rgba(201,169,110,.22),rgba(201,169,110,.08));color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
    .kpi-card,.panel-card,.cap,.mod-card{border-radius:14px;border:1px solid var(--glass-border);background:var(--card-bg)}
    .panel-card{padding:24px}
    .kpi-card{padding:20px}
    .kpi-card:hover,.cap:hover,.mod-card:hover{border-color:var(--accent);box-shadow:0 10px 30px rgba(201,169,110,.12)}
    .kpi-title,.cap .l,.sum-title{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
    .kpi-value{font-size:2.1rem;font-weight:600;color:var(--text-main)}
    .cap .v,.mod-card .v{font-weight:600;font-size:2rem}
    .panel-title{font-size:1.45rem;font-weight:600}
    .panel-header{padding-bottom:12px;border-bottom:1px solid var(--glass-border);margin-bottom:18px}
    .search-box,.select-box{border-radius:10px;border:1px solid var(--glass-border);background:var(--input-bg);font-size:.82rem}
    .search-box:focus,.select-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,169,110,.15)}
    .table-container{border-radius:12px;border:1px solid var(--glass-border)}
    th{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);background:var(--opt-bg);font-weight:700;border-bottom:1px solid var(--glass-border)}
    td{border-bottom:1px solid rgba(201,169,110,.1);font-size:.82rem}
    .page-btn{border-radius:8px;border:1px solid var(--glass-border);background:transparent}
    .page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    .bar-fill,.pbar i{background:linear-gradient(90deg,#a8843f,#e6d3a3)}
    .bar-track,.pbar{background:rgba(201,169,110,.12)}
    .chip{border-color:var(--glass-border);letter-spacing:.08em;text-transform:uppercase;font-size:.64rem}
    .chip.active{background:var(--accent);color:#1b1407;border-color:var(--accent)}
    .av{background:linear-gradient(135deg,#e6d3a3,#a8843f);color:#1b1407}
    .wa-btn{background:linear-gradient(135deg,#2fbf6b,#168a52);letter-spacing:.06em}
    .modal{border-radius:18px;border:1px solid var(--glass-border);box-shadow:0 40px 90px rgba(0,0,0,.6)}
    .modal-t{font-size:1.6rem;font-weight:600}
    .matrix td.on{background:rgba(201,169,110,.2);color:var(--accent)}

</head>
<body>

          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

    <div id="panel-ems" class="module-panel">
      <div class="kpi-grid"><div class="kpi-card"><div class="kpi-title">Total Entry EMS</div><div class="kpi-value" id="ems-kpi-total">0</div></div></div>
      <div class="panel-card">
        <div class="panel-header"><div class="panel-title">Data Detail EMS</div></div>
        <div class="controls-row">
          <input type="text" id="emsSearch" class="search-box" placeholder="Cari data EMS..." oninput="onSearchInput('ems')">
          <select id="emsMonthFilter" class="select-box" onchange="onFilterChange('ems','month')"></select>
          <select id="emsTrainerHOFilter" class="select-box" onchange="onFilterChange('ems','trainerHO')"></select>
          <select id="emsStoreFilter" class="select-box" onchange="onFilterChange('ems','store')"></select>
          <select id="emsTrainerFilter" class="select-box" onchange="onFilterChange('ems','trainer')"></select>
        </div>

    <div id="panel-pnr" class="module-panel">
      <div class="kpi-grid"><div class="kpi-card"><div class="kpi-title">Total Entry PNR</div><div class="kpi-value" id="pnr-kpi-total">0</div></div></div>
      <div class="panel-card">
        <div class="panel-header"><div class="panel-title">Data Detail PNR</div></div>
        <div class="controls-row">
          <input type="text" id="pnrSearch" class="search-box" placeholder="Cari data PNR..." oninput="onSearchInput('pnr')">
          <select id="pnrMonthFilter" class="select-box" onchange="onFilterChange('pnr','month')"></select>
          <select id="pnrStatusFilter" class="select-box" onchange="onFilterChange('pnr','status')"></select>
          <select id="pnrTrainerHOFilter" class="select-box" onchange="onFilterChange('pnr','trainerHO')"></select>
          <select id="pnrStoreFilter" class="select-box" onchange="onFilterChange('pnr','store')"></select>
          <select id="pnrTrainerFilter" class="select-box" onchange="onFilterChange('pnr','trainer')"></select>
        </div>
        <div class="table-container"><table><thead><tr id="pnrThead"></tr></thead><tbody id="pnrTbody"></tbody></table></div>
        <div class="pagination-bar" id="pnrPagination"></div>
      </div>

  <script>
    const DATA_JSON_URL = "./data/data.json";
    // Sheet "Recap" = data master (Store, Trainer HO, Nama Trainer/Presenter). Dibaca ulang setiap refresh.
    const RECAP_SHEET_URL = "https://docs.google.com/spreadsheets/d/1_lvhYAt2RozrhqMWCzFVvm8bCPm4yunnYcie4nM55U4/gviz/tq?tqx=out:json&sheet=Recap";
    const AUTO_REFRESH_INTERVAL = 300000;
    const PAGE_SIZE = 50;
    const MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let recapMasterData = [];
    let metaCache = new WeakMap(), recapByEmail = new Map(), recapByName = new Map(), resolveCache = new Map(), storeCores = [], storeByCode = new Map(), trainerRecs = [], pnrTargets = new Map();   // [{store, nama, email, position, trainerHO}]
    let storeIndex = new Map(); // norm(store) -> {name, ho}
    let state = {
      ops: [], ems: [], pnr: [], activeModule: 'ops',
      pages: {
        ops: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' },
        ems: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' },
        pnr: { page: 1, filter: '', month: 'all', store: 'all', trainerHO: 'all', trainer: 'all' }
      }
    };
    let chartInstances = {};

    const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[\u200b-\u200d\ufeff\u00a0]/g, ' ').replace(/\s+/g, ' ').trim();
    const NO_HO = 'Tanpa Trainer HO';

    function formatDateTime(dateInput) {
      if (!dateInput) return '';
      const date = new Date(dateInput);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).replace('.', ':');
    }

    function cleanHeaderName(str, type) {
      if (!str) return '';
      let clean = String(str).replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
      const lower = clean.toLowerCase();
      if (lower.includes('presenter name') || lower.includes('fill in your full name') || lower.includes('trainer name')) return type === 'pnr' ? 'Trainer Name' : 'Presenter';
      if (lower.includes('tanggal (') || lower.includes('tanggal ( hari')) return 'Tanggal Sesi';
      if (lower.includes('total participants') || lower.includes('berapa banyak pelanggan')) return 'Total Peserta';
      if (lower.includes('unit yang terjual')) return 'Unit Terjual';
      if (lower.includes('produk apa yang pelanggan minati') || lower.includes('pelanggan minati')) return 'Produk Minat';
      if (lower.includes('open studio topics')) return 'Topik Open Studio';
      if (lower.includes('report photo')) return 'Foto Laporan';
      if (lower.includes('timestamp') || lower.includes('waktu input')) return 'Waktu Input';
      if (clean.length > 22) clean = clean.split('(')[0].split(':')[0].trim();
      return clean;
    }

    function getFlexibleValue(row, keywords) {
      if (!row) return null;
      const keys = Object.keys(row);
      for (const kw of keywords) {
        const matchKey = keys.find(k => String(k).toLowerCase().includes(kw.toLowerCase()));
        if (matchKey && row[matchKey] !== undefined && row[matchKey] !== null) {
          const val = String(row[matchKey]).trim();
          if (val !== '' && val !== '-' && val !== '0') return val;
        }
      }
      return null;
    }

    /* ---------- Data master (sheet Recap) ---------- */
    function buildStoreIndex() {
      metaCache = new WeakMap(); recapByEmail = new Map(); recapByName = new Map(); resolveCache = new Map();
      storeIndex = new Map(); storeCores = []; storeByCode = new Map(); trainerRecs = [];
      recapMasterData.forEach(r => {
        const k = norm(r.store);
        if (!k) return;
        let cur = storeIndex.get(k);
        if (!cur) {
          cur = { name: r.store, ho: r.trainerHO || '', type: r.type || '', trainers: new Set(), employees: 0 };
          storeIndex.set(k, cur);
          const code = (r.store.match(/\bm\d{2,4}\b/i) || [])[0];
          if (code) storeByCode.set(code.toLowerCase(), r.store);
          const toks = storeTokens(r.store);
          storeCores.push({ name: r.store, tokens: new Set(toks), key: toks.join('') });
        } else {
          if (!cur.ho && r.trainerHO) cur.ho = r.trainerHO;
          if (!cur.type && r.type) cur.type = r.type;
        }
        if (r.nama && r.nama !== '0') cur.employees++;
        if (r.email) recapByEmail.set(norm(r.email), r);
        if (r.nama) recapByName.set(norm(r.nama), r);
        const isTr = /trainer/i.test(r.position);
        const st = r.storeTrainer || (isTr ? r.nama : '');
        if (st && st !== '0') cur.trainers.add(st);
        if (isTr && r.nama) trainerRecs.push(r);
      });
    }

    function parseRecap(text) {
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const cols = (json.table?.cols || []).map(c => (c.label || '').trim());
      let rows = (json.table?.rows || []).map(r => (r.c || []).map(c => (c && c.v != null) ? String(c.v).trim() : ''));
      let headers = cols;
      // Jika Google tidak mendeteksi header, baris pertama dipakai sebagai header
      if (!cols.some(Boolean) && rows.length) headers = rows.shift();

      const find = (re, exclude, fallback) => {
        const i = headers.findIndex((h, idx) => !exclude.includes(idx) && re.test(String(h).toLowerCase()));
        return i >= 0 ? i : fallback;
      };
      const iST = find(/store\s*trainer|trainer\s*store/, [], -1);
      const iType = find(/type\s*store|tipe\s*store/, [], 9);
      const iHO = find(/trainer\s*ho|ho\s*trainer|\bho\b/, [iST], 10);
      const iStore = find(/store|toko|cabang/, [iHO, iST, iType], 1);
      const iNama = find(/nama|name|presenter|trainer/, [iHO, iStore, iST, iType], 2);
      const iNik = find(/\bnik\b/, [], 3);
      const iExp = find(/work\s*experience|pengalaman/, [], 4);
      const iEmail = find(/email|e-mail/, [iHO, iStore, iNama, iST], 5);
      const iPos = find(/position|posisi|jabatan/, [iHO, iStore, iNama, iEmail, iST], 6);

      return rows.map(c => ({
        store: c[iStore] || '', nama: c[iNama] || '', email: c[iEmail] || '',
        position: c[iPos] || '', trainerHO: c[iHO] || '', storeTrainer: c[iST] || '', nik: c[iNik] || '', exp: c[iExp] || '', type: c[iType] || ''
      })).filter(r => r.store && r.store !== '0' && !/^\s*q\d+/i.test(r.store)).map(r => {
        if (r.trainerHO === '0') r.trainerHO = '';
        if (r.nama === '0') r.nama = '';
        if (r.nik === '0') r.nik = '';
        if (r.type === '0') r.type = '';
        return r;
      });
    }

    async function fetchRecapMasterData() {
      try {
        const res = await fetch(RECAP_SHEET_URL + '&_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        recapMasterData = parseRecap(await res.text());
        localStorage.setItem('recap_cache', JSON.stringify(recapMasterData));
      } catch (err) {
        console.warn('Sheet Recap gagal dibaca, pakai cache:', err);
        try { recapMasterData = JSON.parse(localStorage.getItem('recap_cache') || '[]'); } catch (e) { recapMasterData = []; }
      }
      buildStoreIndex();
    }

    /* ---------- Metadata per baris aktivitas ---------- */
    const STOP = new Set(['digimap', 'apple', 'premium', 'partner', 'store', 'toko', 'ibox', 'mall', 'mal', 'street', 'raya', 'the']);
    function storeTokens(s) { return norm(s).replace(/\bm\d{2,4}\b/g, ' ').split(/[^a-z0-9]+/).filter(t => t && !STOP.has(t)); }
    function lev(a, b) {
      const m = a.length, n = b.length;
      if (Math.abs(m - n) > 2) return 3;
      let prev = Array.from({ length: n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = cur;
      }
      return prev[n];
    }
    // Padankan nama store aktivitas ke nama store di sheet Recap: nama persis -> nama inti -> sebagian kata -> typo -> kode store
    function resolveStore(raw) {
      const hit = storeIndex.get(norm(raw));
      if (hit) return hit.name;
      if (resolveCache.has(raw)) return resolveCache.get(raw);
      const toks = storeTokens(raw), key = toks.join('');
      let best = null, bs = 0, tie = false;
      storeCores.forEach(c => {
        let sc = 0;
        if (key && c.key === key) sc = 100;
        else {
          const inter = toks.filter(t => c.tokens.has(t));
          if (inter.length && (inter.length === toks.length || inter.length === c.tokens.size) && inter.some(t => t.length >= 4)) sc = 10 + inter.length;
          else if (key.length >= 6 && c.key.length >= 6 && lev(key, c.key) <= 2) sc = 5;
        }
        if (sc > bs) { best = c; bs = sc; tie = false; } else if (sc && sc === bs) tie = true;
      });
      let out = raw;
      if (best && !tie) out = best.name;
      else { const code = (String(raw).match(/\bm\d{2,4}\b/i) || [])[0]; if (code && storeByCode.has(code.toLowerCase())) out = storeByCode.get(code.toLowerCase()); }
      resolveCache.set(raw, out);
      return out;
    }
    function rawStoreOf(row) {
      let raw = null; // abaikan kolom seperti "Type of Training (... In-Store Coaching ...)"
      for (const kw of ['location', 'lokasi', 'store', 'toko', 'cabang', 'outlet']) {
        const k = Object.keys(row).find(k => k.toLowerCase().includes(kw) && !/trainer|training|coaching|type|total/i.test(k) && row[k] != null && !['', '-', '0'].includes(String(row[k]).trim()));
        if (k) { raw = String(row[k]).trim(); break; }
      }
      return raw;
    }
    const isQStore = s => /^\s*q\d+/i.test(String(s || ''));
    const isQRow = r => isQStore(rawStoreOf(r));
    function getRowStore(row) {
      const raw = rawStoreOf(row);
      return raw ? resolveStore(raw) : null;
    }

    function getRowTrainer(row) {
      return getFlexibleValue(row, ['trainer', 'presenter', 'nama trainer', 'nama presenter', 'staff', 'nama', 'nps', 'participants name']);
    }

    function monthKeyFromLabel(label) {
      const mi = MONTH_NAMES_ID.findIndex(n => label.toLowerCase().includes(n.toLowerCase()));
      const y = (label.match(/\b(19|20)\d{2}\b/) || [])[0];
      return mi >= 0 && y ? parseInt(y) * 100 + mi : 0;
    }

    const MONTH_NAMES_EN = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    function monthFromText(low) {
      for (let i = 0; i < 12; i++) {
        if (new RegExp('\\b(' + MONTH_NAMES_ID[i].toLowerCase() + '|' + MONTH_NAMES_EN[i] + ')\\b').test(low)) return i;
      }
      return -1;
    }
    function parseAnyDate(v) {
      const s = String(v).trim(), low = s.toLowerCase();
      let m = s.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/);
      if (m) return new Date(+m[1], +m[2], +m[3]);
      const yr = low.match(/\b((?:19|20)\d{2})\b/), mi = monthFromText(low);
      if (mi >= 0 && yr) { const dm = low.replace(yr[1], ' ').match(/(?<!\d)(0?[1-9]|[12]\d|3[01])(?!\d)/); return new Date(+yr[1], mi, dm ? +dm[1] : 1); }
      m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]); // dd/mm/yyyy
      if (/^\d{1,3}$/.test(s)) return null;
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }
    function getRowMonthInfo(row) {
      const kv = names => { const k = Object.keys(row).find(k => names.includes(norm(k))); return k && row[k] != null ? String(row[k]).trim() : ''; };
      const mName = kv(['month', 'bulan']), yr = kv(['year', 'tahun']), dd = kv(['date', 'tanggal']);
      if (mName && /^\d{4}$/.test(yr)) { // kolom Month + Date + Year terpisah (mis. data PnR)
        const mi = monthFromText(norm(mName));
        if (mi >= 0) return { label: `${MONTH_NAMES_ID[mi]} ${yr}`, key: +yr * 100 + mi, date: new Date(+yr, mi, /^\d{1,2}$/.test(dd) ? +dd : 1) };
      }
      const direct = getFlexibleValue(row, ['bulan', 'month']);
      const cands = [direct, ...['tanggal', 'date', 'waktu', 'timestamp'].map(k => getFlexibleValue(row, [k]))];
      for (const v of cands) {
        if (!v) continue;
        const d = parseAnyDate(v);
        if (d && d.getFullYear() > 1990) return { label: `${MONTH_NAMES_ID[d.getMonth()]} ${d.getFullYear()}`, key: d.getFullYear() * 100 + d.getMonth(), date: d };
      }
      return direct ? { label: direct, key: monthKeyFromLabel(direct), date: null } : null;
    }
    function statusOf(row) {
      const v = getFlexibleValue(row, ['status']);
      if (!v) return '';
      return /plan/i.test(v) ? 'Planning' : /deliver/i.test(v) ? 'Delivered' : v;
    }
    const exactKey = (r, names) => { const k = Object.keys(r).find(k => names.includes(norm(k))); return k && r[k] != null ? String(r[k]).trim() : ''; };
    const inclKey = (r, part) => { const k = Object.keys(r).find(k => norm(k).includes(part)); return k && r[k] != null ? String(r[k]).trim() : ''; };
    const fmtDate = d => `${d.getDate()} ${MONTH_NAMES_ID[d.getMonth()]} ${d.getFullYear()}`;
    const hourNum = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
    const partOf = r => parseInt(getFlexibleValue(r, ['participant', 'peserta'])) || 0;
    const unitsOf = r => parseInt(getFlexibleValue(r, ['unit yang terjual', 'unit terjual', 'terjual'])) || 0;
    const tokensOf = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
    function sameName(a, b) {
      const x = tokensOf(a), y = tokensOf(b);
      if (!x.length || !y.length) return false;
      const [sm, lg] = x.length <= y.length ? [x, y] : [y, x];
      return sm.every(t => lg.includes(t)) && (sm.length >= 2 || sm[0].length >= 4);
    }
    // Slot sesi Open Studio (13:00 / 15:00 / 18:00): dari kolom jam sesi, jika tidak ada dari jam pengisian form
    function slotOf(row) {
      let h = null;
      for (const k of Object.keys(row)) {
        if (!/jam|time|sesi|session|slot/i.test(k) || /timestamp|input/i.test(k)) continue;
        const m = String(row[k] == null ? '' : row[k]).match(/(?<![\d:])([01]?\d|2[0-3])\s*[:.]\s*[0-5]\d(?!\d)/);
        if (m) { h = +m[1]; break; }
      }
      if (h == null) { const ts = getFlexibleValue(row, ['timestamp', 'waktu']); const m = ts && ts.match(/(\d{1,2}):\d{2}/); if (m) h = +m[1]; }
      return h == null ? '' : h < 14 ? '13:00' : h < 17 ? '15:00' : '18:00';
    }
    function _calcMeta(row) {
      let store = getRowStore(row) || '', trainer = getRowTrainer(row) || '', rec = null;
      if (!store || !trainer) { // lengkapi lewat email / nama staff di sheet Recap
        const em = getFlexibleValue(row, ['email', 'e-mail']);
        rec = (em && recapByEmail.get(norm(em))) || (trainer && recapByName.get(norm(trainer))) || null;
        if (rec) { if (!store && rec.store) store = resolveStore(rec.store); if (!trainer) trainer = rec.nama || ''; }
      }
      const mi = getRowMonthInfo(row);
      const idx = store ? storeIndex.get(norm(store)) : null;
      let ho = idx ? idx.ho : '';
      if (!ho) { const r2 = rec || (trainer && recapByName.get(norm(trainer))); if (r2 && r2.trainerHO) ho = r2.trainerHO; }
      return { store, trainer, month: mi ? mi.label : '', monthKey: mi ? mi.key : 0, date: mi && mi.date ? mi.date : null,
        ho, st: idx ? Array.from(idx.trainers) : [], status: statusOf(row), slot: slotOf(row), hours: hourNum(exactKey(row, ['hours'])) };
    }
    function getRowMeta(row) {
      let m = metaCache.get(row);
      if (!m) { m = _calcMeta(row); metaCache.set(row, m); }
      return m;
    }

    /* ---------- Dropdown berkelompok & saling terhubung ---------- */
    function groupBy(items, keyFn) {
      const g = new Map();
      items.forEach(it => { const k = keyFn(it); if (!g.has(k)) g.set(k, []); g.get(k).push(it); });
      return g;
    }
    const byName = (a, b) => a.localeCompare(b, 'id', { numeric: true, sensitivity: 'base' });

    function renderSelect(id, defaultText, groups, current) {
      const el = document.getElementById(id);
      if (!el) return;
      const esc = escapeHtml;
      let html = `<option value="all">${defaultText}</option>`;
      const labels = Array.from(groups.keys()).sort((a, b) => (a === NO_HO) - (b === NO_HO) || byName(a, b));
      const useGroups = labels.length > 1 || (labels.length === 1 && labels[0] !== NO_HO && groups.get(labels[0]).length > 0 && groups.__grouped);
      labels.forEach(label => {
        const opts = groups.get(label).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
        html += groups.__grouped ? `<optgroup label="${esc(label)}">${opts}</optgroup>` : opts;
      });
      el.innerHTML = html;
      el.value = current;
      if (el.value !== current) el.value = 'all';
    }

    const DIMS = ['month', 'trainerHO', 'store', 'trainer', 'status'];
    function dimMatch(type, m, dim, v) {
      if (v == null || v === 'all') return true;
      if (dim === 'month') return m.month === v;
      if (dim === 'trainerHO') return type === 'pnr' ? m.st.includes(v) : m.ho === v;
      if (dim === 'store') return norm(m.store) === norm(v);
      if (dim === 'trainer') return norm(m.trainer) === norm(v);
      if (dim === 'status') return m.status === v;
      return true;
    }
    const rowOk = (type, m, p, skip) => DIMS.every(d => d === skip || dimMatch(type, m, d, p[d]));

    function facet(type, dim, rows, tname) {
      const out = new Map();
      const add = (value, group, ord) => {
        if (!value) return;
        const e = out.get(value) || { value, count: 0, group, ord };
        e.count++; out.set(value, e);
      };
      rows.forEach(r => {
        if (dim === 'month') add(r.month, '', -r.monthKey);
        else if (dim === 'trainerHO') { if (type === 'pnr') r.st.forEach(t => add(t)); else add(r.ho); }
        else if (dim === 'store') add(r.store, type === 'pnr' ? (r.st.join(', ') || 'Tanpa Store Trainer') : (r.ho || NO_HO));
        else if (dim === 'trainer') add(tname.get(norm(r.trainer)), r.store || 'Tanpa Store');
        else if (dim === 'status') add(r.status);
      });
      return Array.from(out.values()).sort((a, b) => (a.ord || 0) - (b.ord || 0) || byName(a.value, b.value));
    }

    function fillSelect(id, defText, entries, current, grouped) {
      const el = document.getElementById(id);
      if (!el) return;
      const opt = e => `<option value="${escapeHtml(e.value)}">${escapeHtml(e.value)} (${e.count})</option>`;
      let html = `<option value="all">${defText}</option>`;
      if (grouped) {
        const g = groupBy(entries, e => e.group);
        Array.from(g.keys()).sort((a, b) => /^Tanpa/.test(a) - /^Tanpa/.test(b) || byName(a, b)).forEach(k => {
          html += `<optgroup label="${escapeHtml(k)}">${g.get(k).map(opt).join('')}</optgroup>`;
        });
      } else html += entries.map(opt).join('');
      el.innerHTML = html;
      el.value = current;
      if (el.value !== current) el.value = 'all';
    }

    // Opsi tiap dropdown hanya berisi nilai yang benar-benar ada di data aktivitas (sudah dipadankan dengan sheet Recap),
    // dan menyesuaikan pilihan dropdown lainnya, sehingga setiap pilihan pasti menghasilkan data.
    function populateDropdowns(type) {
      const p = state.pages[type], isPNR = type === 'pnr';
      const metas = (state[type] || []).map(getRowMeta);
      const tname = new Map();
      metas.forEach(m => { const k = norm(m.trainer); if (k && !tname.has(k)) tname.set(k, m.trainer); });
      const dims = isPNR ? DIMS : DIMS.filter(d => d !== 'status');
      const res = {};
      for (let pass = 0; pass < 4; pass++) {
        let changed = false;
        dims.forEach(d => {
          res[d] = facet(type, d, metas.filter(m => rowOk(type, m, p, d)), tname);
          if (p[d] !== 'all' && !res[d].some(e => e.value === p[d])) { p[d] = 'all'; changed = true; }
        });
        if (!changed) break;
      }
      const L = { month: '📅 Semua Bulan', trainerHO: isPNR ? '🏷️ Semua Store Trainer' : '👔 Semua Trainer HO', store: '🏪 Semua Store', trainer: '👤 Semua Staff', status: '📌 Semua Status' };
      const C = { month: 'Month', trainerHO: 'TrainerHO', store: 'Store', trainer: 'Trainer', status: 'Status' };
      dims.forEach(d => fillSelect(`${type}${C[d]}Filter`, L[d], res[d], p[d], d === 'store' || d === 'trainer'));
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- Ambil data aktivitas (OPS / EMS / PNR) ---------- */
    async function _fetchLatestData() {
      const lastSync = localStorage.getItem('last_sync');
      const fallbackTime = lastSync ? formatDateTime(lastSync) : formatDateTime(new Date());

      
      try {
        const res = await fetch(DATA_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('File data.json tidak ditemukan');
        const data = await res.json();

        if (data.status === 'success' || data.sheets) {
          state.ops = data.sheets?.ops || data.ops || [];
          state.ems = data.sheets?.ems || data.ems || [];
          state.pnr = data.sheets?.pnr || data.pnr || [];
        } else if (Array.isArray(data)) {
          state.ops = data;
        }
        const syncTimestamp = data.last_updated || new Date().toISOString();
        try {
          localStorage.setItem('cached_state', JSON.stringify({ ops: state.ops, ems: state.ems, pnr: state.pnr }));
          localStorage.setItem('last_sync', syncTimestamp);
        } catch (e) {}
        refreshAll();
        updateSyncStatus(`Diperbarui ${formatDateTime(syncTimestamp)}`);
      } catch (err) {
        console.warn('Membaca data dari cache lokal:', err);
        const cached = localStorage.getItem('cached_state');
        if (cached) {
          const parsed = JSON.parse(cached);
          state.ops = parsed.ops || [];
          state.ems = parsed.ems || [];
          state.pnr = parsed.pnr || [];
          refreshAll();
        }
        updateSyncStatus(`Offline · cache ${fallbackTime}`, 'warn');
      }
    }

    function refreshAll() {
      ['ops', 'ems', 'pnr'].forEach(t => { state[t] = (state[t] || []).filter(r => !isQRow(r)); }); // abaikan store berkode Q
      ['ops', 'ems', 'pnr'].forEach(populateDropdowns);
      renderCurrentModule();
    }

    function renderCurrentModule() {
      if (state.activeModule === 'ops') renderOPS();
      if (state.activeModule === 'ems') renderEMS();
      if (state.activeModule === 'pnr') renderPNR();
      if (state.activeModule === 'all') renderAllSummary();
      if (state.activeModule === 'roster') renderRoster();
    }

    function getFilteredData(type) {
      const p = state.pages[type], q = (p.filter || '').toLowerCase();
      return (state[type] || []).filter(row => {
        if (!rowOk(type, getRowMeta(row), p)) return false;
        return !q || Object.values(row).some(v => String(v || '').toLowerCase().includes(q));
      });
    }

    const STORE_TARGET = 85;
    function renderOPS() {
      const filteredData = getFilteredData('ops');
      document.getElementById('ops-kpi-total').textContent = filteredData.length.toLocaleString('id-ID');
      let totalParticipants = 0, totalUnits = 0;
      const topicCounts = {};
      filteredData.forEach(row => {
        totalParticipants += partOf(row); totalUnits += unitsOf(row);
        const t = getFlexibleValue(row, ['topics', 'topik']) || 'Lainnya';
        topicCounts[t] = (topicCounts[t] || 0) + 1;
      });
      document.getElementById('ops-kpi-participants').textContent = totalParticipants.toLocaleString('id-ID');
      document.getElementById('ops-kpi-units').textContent = totalUnits.toLocaleString('id-ID');
      renderOpsStoreTable(filteredData);
      renderModuleSummary('ops', filteredData, [
        ['Rata-rata Peserta / Sesi', filteredData.length ? (totalParticipants / filteredData.length).toFixed(1).replace('.', ',') : '0'],
        ['Unit Terjual / Peserta', totalParticipants ? (totalUnits / totalParticipants).toFixed(2).replace('.', ',') : '0']
      ]);
      renderChart('opsChart', topicCounts);
      renderCompare('ops'); renderMatrix('ops');
    }

    // Data Detail OPS: Store x slot 13:00 / 15:00 / 18:00, total, target 85 per store, % — klik store untuk detail
    function renderOpsStoreTable(data) {
      const p = state.pages.ops;
      const blank = name => ({ name, s: { '13:00': 0, '15:00': 0, '18:00': 0 }, total: 0, rows: [] });
      const agg = new Map();
      data.forEach(r => {
        const m = getRowMeta(r), k = m.store || '(Tanpa Store)';
        let e = agg.get(k);
        if (!e) { e = blank(k); agg.set(k, e); }
        if (m.slot) e.s[m.slot]++;
        e.total++; e.rows.push(r);
      });
      if (!p.filter && p.store === 'all' && p.trainer === 'all' && p.trainerHO === 'all') storeIndex.forEach(v => { if (!agg.has(v.name)) agg.set(v.name, blank(v.name)); });
      const list = Array.from(agg.values()).sort((a, b) => b.total - a.total || byName(a.name, b.name));
      const sum = list.reduce((a, e) => { a.t += e.total; ['13:00', '15:00', '18:00'].forEach(k => { a[k] += e.s[k]; }); return a; }, { t: 0, '13:00': 0, '15:00': 0, '18:00': 0 });
      const cls = v => v >= 100 ? 'g' : v >= 50 ? 'a' : 'r';
      const pc = n => Math.round(n / STORE_TARGET * 100);
      document.getElementById('opsThead').innerHTML = ['Store', '13:00', '15:00', '18:00', 'TOTAL', 'TARGET', '%'].map(h => `<th>${h}</th>`).join('');
      const totTarget = STORE_TARGET * list.length, tp = totTarget ? Math.round(sum.t / totTarget * 100) : 0;
      const rowsHtml = list.map(e => {
        const v = pc(e.total);
        const dr = reg(() => ({ title: e.name, sub: `OPS ${fmt(e.total)} entry · target ${STORE_TARGET} (${v}%)`, ...detailRows('ops', e.rows) }));
        return `<tr class="clickable" onclick="openDrill(${dr})"><td>${escapeHtml(e.name)}</td><td>${e.s['13:00']}</td><td>${e.s['15:00']}</td><td>${e.s['18:00']}</td><td><strong>${e.total}</strong></td><td>${STORE_TARGET}</td><td><span class="pct ${cls(v)}">${v}%</span><span class="pbar"><i style="width:${Math.min(100, v)}%"></i></span></td></tr>`;
      }).join('');
      document.getElementById('opsTbody').innerHTML = list.length
        ? `<tr class="totrow"><td>Semua Store (${list.length})</td><td>${sum['13:00']}</td><td>${sum['15:00']}</td><td>${sum['18:00']}</td><td>${sum.t}</td><td>${fmt(totTarget)}</td><td><span class="pct ${cls(tp)}">${tp}%</span></td></tr>` + rowsHtml
        : '<tr><td colspan="7" style="text-align:center;padding:24px">Data tidak ditemukan untuk kombinasi filter ini.</td></tr>';
      document.getElementById('opsPagination').innerHTML = `<div>${list.length} store · target ${STORE_TARGET} entry per store${p.month === 'all' ? ' (pilih bulan agar % sesuai target bulanan)' : ''}</div><div>Klik store untuk melihat detail</div>`;
    }

    function renderEMS() {
      const d = getFilteredData('ems');
      document.getElementById('ems-kpi-total').textContent = d.length.toLocaleString('id-ID');
      renderTableWithPagination('ems', d);
      renderModuleSummary('ems', d);
      renderChart('emsChart', countTopics('ems', d));
      renderCompare('ems'); renderMatrix('ems');
    }

    function renderPNR() {
      const d = getFilteredData('pnr');
      document.getElementById('pnr-kpi-total').textContent = d.length.toLocaleString('id-ID');
      renderTableWithPagination('pnr', d);
      renderModuleSummary('pnr', d);
      renderChart('pnrChart', countTopics('pnr', d));
      renderCompare('pnr'); renderRekapPNR();
    }

    function getAllHeaders(data) {
      const s = new Set();
      data.forEach(row => Object.keys(row).forEach(k => s.add(k)));
      return Array.from(s);
    }

    const PNR_SPEC = [
      { h: 'Store', f: r => getRowMeta(r).store || inclKey(r, 'location') },
      { h: 'Store Trainer', f: r => getRowMeta(r).trainer },
      { h: 'Modules', f: r => exactKey(r, ['modules']) },
      { h: 'Type of Training', f: r => inclKey(r, 'type of training') },
      { h: 'Total Session', f: r => inclKey(r, 'total session') },
      { h: 'Total Staff Trained', f: r => inclKey(r, 'total staff trained') },
      { h: 'Month & Date', f: r => {
        const mm = exactKey(r, ['month']), yy = exactKey(r, ['year']), dd = exactKey(r, ['date']);
        if (mm && yy) return `${/^\d{1,2}$/.test(dd) ? dd + ' ' : ''}${mm} ${yy}`;
        const d = getRowMeta(r).date; return d ? fmtDate(d) : '';
      } },
      { h: 'Topik (Mandatory / Other)', html: true, f: r => {
        const ms = exactKey(r, ['modules']), t = getTopics('pnr', r, 'all').join(', ');
        const tag = /mandatory/i.test(ms) ? 'Mandatory' : /other/i.test(ms) ? 'Other' : '';
        return (tag ? `<span class="badge ${tag === 'Mandatory' ? 'b-man' : 'b-oth'}">${tag}</span> ` : '') + escapeHtml(t || '-');
      } },
      { h: 'Status', html: true, f: r => { const s = getRowMeta(r).status; return s ? `<span class="badge ${s === 'Delivered' ? 'b-del' : 'b-plan'}">${escapeHtml(s)}</span>` : '-'; } },
      { h: 'Participant name', f: r => inclKey(r, 'participant') },
      { h: 'Any Comment', f: r => inclKey(r, 'comment') },
      { h: 'Hours', f: r => exactKey(r, ['hours']) }
    ];
    function tableSpec(type) {
      if (type === 'pnr') return PNR_SPEC;
      return [{ h: 'Bulan', f: r => getRowMeta(r).month || '-' }].concat(getAllHeaders(state[type]).map(k => ({ h: cleanHeaderName(k, type), f: r => r[k] })));
    }
    function detailRows(type, rows) {
      const spec = tableSpec(type);
      return { heads: spec.map(c => c.h), rows: rows.map(r => spec.map(c => { let v = c.f(r); if (v == null || v === '') v = '-'; return c.html ? v : escapeHtml(v); })) };
    }
    function renderTableWithPagination(type, filteredData) {
      const p = state.pages[type];
      const totalItems = filteredData.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;
      if (p.page > totalPages) p.page = totalPages;
      if (p.page < 1) p.page = 1;
      const startIndex = (p.page - 1) * PAGE_SIZE;
      const paginatedData = filteredData.slice(startIndex, startIndex + PAGE_SIZE);
      const thead = document.getElementById(`${type}Thead`), tbody = document.getElementById(`${type}Tbody`);
      if (totalItems === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td style="text-align:center; padding:24px;">Data tidak ditemukan untuk kombinasi filter ini.</td></tr>';
        renderPaginationControls(type, 0, 0, 0, 0);
        return;
      }
      const spec = tableSpec(type);
      thead.innerHTML = spec.map(c => `<th>${escapeHtml(c.h)}</th>`).join('');
      tbody.innerHTML = paginatedData.map(row => `<tr>${spec.map(c => {
        let v = c.f(row);
        if (v === undefined || v === null || v === '') v = '-';
        return `<td>${c.html ? v : escapeHtml(v)}</td>`;
      }).join('')}</tr>`).join('');
      renderPaginationControls(type, totalItems, p.page, totalPages, paginatedData.length);
    }

    function renderPaginationControls(type, totalItems, currentPage, totalPages, currentDisplayed) {
      const c = document.getElementById(`${type}Pagination`);
      if (!c) return;
      if (totalItems === 0) { c.innerHTML = '<span>Menampilkan 0 data</span>'; return; }
      const start = (currentPage - 1) * PAGE_SIZE + 1;
      const end = start + currentDisplayed - 1;
      c.innerHTML = `
        <div>Menampilkan <strong>${start} - ${end}</strong> dari <strong>${totalItems.toLocaleString('id-ID')}</strong> data terfilter</div>
        <div class="pagination-buttons">
          <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage('${type}', ${currentPage - 1})">◄ Prev</button>
          <span style="margin:0 8px;font-weight:600;">Hal ${currentPage} dari ${totalPages}</span>
          <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage('${type}', ${currentPage + 1})">Next ►</button>
        </div>`;
    }

    function changePage(type, newPage) { state.pages[type].page = newPage; renderCurrentModule(); }

    function onSearchInput(type) {
      state.pages[type].filter = document.getElementById(`${type}Search`).value;
      state.pages[type].page = 1;
      renderCurrentModule();
    }

    function onFilterChange(type, key) {
      const id = `${type}${key.charAt(0).toUpperCase() + key.slice(1)}Filter`;
      state.pages[type][key] = document.getElementById(id).value;
      state.pages[type].page = 1;
      populateDropdowns(type); // dropdown lain ikut menyesuaikan (HO -> Store -> Trainer)
      renderCurrentModule();
    }

    const PALETTE = ['#c9a96e', '#a8843f', '#7d6330', '#d8b97a', '#8c7a5a', '#5e5646'];
    const numPlugin = {
      id: 'numLabels',
      afterDatasetsDraw(chart) {
        const ds = chart.data.datasets[0], total = ds.data.reduce((a, b) => a + b, 0), ctx = chart.ctx;
        const root = getComputedStyle(document.documentElement);
        const tc = root.getPropertyValue('--text-main').trim(), mc = root.getPropertyValue('--text-muted').trim();
        const font = w => `${w}px "Plus Jakarta Sans",sans-serif`;
        ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (!total) {
          ctx.fillStyle = mc; ctx.font = font('600 13'); ctx.fillText('Belum ada data', chart.width / 2, chart.height / 2);
          ctx.restore(); return;
        }
        ctx.font = font('700 13'); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 3;
        chart.getDatasetMeta(0).data.forEach((arc, i) => {
          const v = ds.data[i];
          if (v / total < 0.04) return;
          const pos = arc.tooltipPosition();
          ctx.fillText(v.toLocaleString('id-ID'), pos.x, pos.y);
        });
        ctx.shadowBlur = 0;
        const a = chart.chartArea, cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2;
        ctx.fillStyle = tc; ctx.font = font('700 22'); ctx.fillText(total.toLocaleString('id-ID'), cx, cy - 6);
        ctx.fillStyle = mc; ctx.font = font('500 11'); ctx.fillText('total', cx, cy + 13);
        ctx.restore();
      }
    };
    function renderChart(canvasId, topicCounts) {
      if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const sorted = Object.entries(topicCounts).sort((a, b) => b[1] - a[1]).slice(0, 6);
      chartInstances[canvasId] = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: sorted.map(i => `${i[0]} (${i[1]})`),
          datasets: [{ data: sorted.map(i => i[1]), backgroundColor: PALETTE, borderColor: 'rgba(15,23,42,.35)', borderWidth: 2 }]
        },
        plugins: [numPlugin],
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '58%',
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: getComputedStyle(document.documentElement).getPropertyValue('--text-main').trim() } } }
        }
      });
    }

    function switchModule(mod, btn) {
      state.activeModule = mod;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${mod}`).classList.add('active');
      renderCurrentModule();
    }

    function updateSyncStatus(msg, cls = '') {
      const pill = document.getElementById('cloudStatusPill');
      pill.className = 'status-pill ' + cls;
      pill.innerHTML = `<span>${msg}</span>`;
    }

    /* ---------- Summary ---------- */
    let isLoading = false;
    function setProg(pc, label) {
      const b = document.getElementById('manualSyncBtn');
      b.style.setProperty('--p', pc + '%');
      b.querySelector('.lbl').textContent = label;
    }
    async function fetchLatestData() {
      if (isLoading) return;
      isLoading = true;
      const btn = document.getElementById('manualSyncBtn');
      btn.disabled = true; btn.classList.remove('done'); btn.classList.add('loading');
      let done = 0;
      const tick = () => { done++; const v = Math.round(done / 4 * 100); setProg(v, `Memuat ${v}%`); };
      const t = pr => pr.then(r => { tick(); return r; }, e => { tick(); throw e; });
      setProg(6, 'Memuat 6%'); updateSyncStatus('Memuat data…', 'loading');
      try {
        await Promise.all([t(fetchRecapMasterData()), t(fetchTargets()), t(fetchRoster())]);
        await t(_fetchLatestData());
        const off = document.getElementById('cloudStatusPill').classList.contains('warn');
        setProg(100, off ? 'Selesai · offline' : '✓ Berhasil 100%'); btn.classList.add('done');
      } catch (e) { setProg(100, 'Gagal memuat'); }
      isLoading = false;
      await new Promise(r => setTimeout(r, 1800));
      btn.disabled = false; btn.classList.remove('loading', 'done'); setProg(0, 'Refresh');
    }

    let topicMode = 'all';
    function setTopicMode(m) {
      topicMode = m;
      document.querySelectorAll('#pnr-chips .chip').forEach(b => b.classList.toggle('active', b.dataset.m === m));
      renderPNR();
    }

    function initSummaryHosts() {
      try { const th = localStorage.getItem('theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
      const mk = (id, cls) => { const d = document.createElement('div'); d.id = id; d.className = cls; return d; };
      ['ops', 'ems', 'pnr'].forEach(t => {
        state.pages[t].status = 'all';
        const sum = mk(`${t}-summary`, 'panel-card sum-wrap'), cmp = mk(`${t}-compare`, 'panel-card sum-wrap');
        document.querySelector(`#panel-${t} .kpi-grid`).after(sum);
        sum.after(cmp);
        if (t !== 'ops') { // tabel + diagram Topik Terpopuler berdampingan
          const tp = document.querySelector(`#panel-${t} > .panel-card:not(.sum-wrap)`);
          const grid = document.createElement('div'); grid.className = 'content-grid';
          const cp = document.createElement('div'); cp.className = 'panel-card';
          const chips = t === 'pnr' ? `<div class="chips" id="pnr-chips">${[['all', 'Semua'], ['mandatory', 'Mandatory'], ['other', 'Other']].map(c => `<button class="chip${c[0] === 'all' ? ' active' : ''}" data-m="${c[0]}" onclick="setTopicMode('${c[0]}')">${c[1]}</button>`).join('')}</div>` : '';
          cp.innerHTML = `<div class="panel-header"><div class="panel-title">Topik Terpopuler</div>${chips}</div><div class="chart-wrap"><canvas id="${t}Chart"></canvas></div>`;
          tp.before(grid); grid.append(tp, cp);
        }
        document.getElementById(`panel-${t}`).appendChild(mk(t === 'pnr' ? 'pnr-rekap' : `${t}-matrix`, 'panel-card sum-wrap'));
      });

    /* ---------- Comparison like for like (minggu & bulan sebelumnya) ---------- */

      const today = sod(new Date());

      if (anchor > today) anchor = today;
      const dow = (anchor.getDay() + 6) % 7;
      const wCur = [addD(anchor, -dow), anchor], wPrev = [addD(anchor, -dow - 7), addD(anchor, -7)];
      const pLen = new Date(anchor.getFullYear(), anchor.getMonth(), 0).getDate();
      const mCur = [new Date(anchor.getFullYear(), anchor.getMonth(), 1), anchor];
      const mPrev = [new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1), new Date(anchor.getFullYear(), anchor.getMonth() - 1, Math.min(anchor.getDate(), pLen))];

    async function fetchRoster() {

        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        if (json.status === 'error') throw new Error((json.errors && json.errors[0] && json.errors[0].detailed_message) || `Sheet "${rosterMonth}" tidak ditemukan`);
        const grid = (json.table.rows || []).map(r => (r.c || []).map(c => (c && c.v != null) ? String(c.v).trim() : ''));
        const labels = (json.table.cols || []).map(c => (c.label || '').trim());
        if (labels.some(Boolean)) grid.unshift(labels);
        const hi = grid.findIndex(r => r.some(c => /^nama\s*toko$/i.test(c)));
        if (hi < 0) throw new Error('Header "Nama Toko" tidak ditemukan di sheet ' + rosterMonth);
        const head = grid[hi], dayRow = grid[hi + 1] || [];
        const iStore = head.findIndex(c => /nama\s*toko/i.test(c));
        const iTr = head.findIndex(c => /nama\s*trainer/i.test(c));
        const iWa = head.findIndex(c => /whatsapp|^wa$/i.test(c));
        const first = Math.max(iStore, iTr, iWa) + 1;
        const hasDays = dayRow.some((c, i) => i >= first && /^\d+$/.test(c));
        const days = [];
        for (let i = first; i < head.length; i++) {
          const d = hasDays ? parseInt(dayRow[i]) : NaN;
          if (head[i] || d) days.push({ i, wd: head[i] || '', day: d || days.length + 1 });
        }
        roster.title = (grid.find(r => /roster/i.test(r[0] || '')) || [''])[0];
        roster.legend = (grid.find(r => /legend/i.test(r[0] || '')) || [''])[0];
        roster.days = days;
        roster.rows = grid.slice(hi + (hasDays ? 2 : 1)).filter(r => r[iStore] && !/^\s*q\d+/i.test(r[iStore]))
          .map(r => ({ store: r[iStore], trainer: iTr >= 0 ? r[iTr] || '' : '', wa: iWa >= 0 ? r[iWa] || '' : '', shifts: days.map(d => (r[d.i] || '').toUpperCase()) }));
        const now = new Date();
        const ti = rosterMonth === ROSTER_MONTHS[now.getMonth()] ? days.findIndex(d => d.day === now.getDate()) : -1;
        if (roster.day >= days.length || !roster.loaded) roster.day = ti >= 0 ? ti : 0;
        roster.loaded = true; roster.error = ''; roster.at = new Date();
      } catch (err) {
        console.warn('Roster gagal dimuat:', err);

        <div class="panel-card sum-wrap">
          <div class="panel-title" style="margin-bottom:12px">Tren Entry per Bulan (12 bulan terakhir)</div>
          <div class="chart-wrap" style="height:300px;flex:none;min-height:0"><canvas id="allTrendChart"></canvas></div>
        </div>
        <div class="content-grid" style="grid-template-columns:1fr 1fr">
          <div class="panel-card"><div class="sum-title">Rekap per Bulan</div>${miniTable(['Bulan', 'OPS', 'EMS', 'PNR', 'Total', 'Δ Bulan lalu'], monthRows, 340, monthDr)}</div>
          <div class="panel-card"><div class="sum-title">Rekap per Trainer HO</div>${miniTable(['Trainer HO', 'OPS', 'EMS', 'PNR', 'Total'], hoRows, 340, hoDr)}</div>
        </div>
        <div class="panel-card sum-wrap">
          <div class="sum-title">Rekap per Store (${storeRows.length} store aktif)</div>
          ${miniTable(['Store', 'Trainer HO', 'Store Trainer', 'OPS', 'EMS', 'PNR', 'Total', 'Peserta', 'Unit'], storeRows, 420, storeDr)}
        </div>
        <div class="panel-card sum-wrap">
          <div class="sum-cols">
            ${barList('Top 5 Store', countBy(sel, x => x.m.store), 5, k => mixedDetail(k, sel.filter(x => x.m.store === k)))}
            ${barList('Top 5 Staff', countBy(sel, x => x.m.trainer), 5, k => mixedDetail(k, sel.filter(x => x.m.trainer === k)))}
            ${barList('Status PNR', countBy(pnrRows, x => x.m.status), 5, k => mixedDetail(`Status ${k}`, pnrRows.filter(x => x.m.status === k)))}
            ${barList('Top Topik OPS', topicOf('ops'), 5, topicD('ops'))}
            ${barList('Top Topik EMS', topicOf('ems'), 5, topicD('ems'))}
            ${barList('Top Topik PNR (Mandatory & Other)', topicOf('pnr'), 5, topicD('pnr'))}
            <div class="sum-block clickable" onclick="openDrill(${reg(() => listDetail('Store belum ada aktivitas', idle.map(n => [n, 0])))})"><div class="sum-title">Store Belum Ada Aktivitas (${idle.length})</div><div class="muted" style="font-size:.82rem;line-height:1.6">${storeIndex.size ? listTxt(idle, 14) : 'Data Recap belum terbaca.'}</div></div>
            <div class="sum-block clickable" onclick="openDrill(${reg(() => listDetail('Nama store belum cocok dengan Recap', unmatched))})"><div class="sum-title">Nama Store Tidak Cocok dengan Recap (${unmatched.length})</div><div class="muted" style="font-size:.82rem;line-height:1.6">${listTxt(unmatched.map(e => `${e[0]} (${e[1]})`), 10)}</div></div>
            <div class="sum-block clickable" onclick="openDrill(${reg(() => mixedDetail('Entry tanpa Trainer HO', noHO))})"><div class="sum-title">Entry Tanpa Trainer HO (${noHO.length})</div><div class="muted" style="font-size:.82rem;line-height:1.6">${listTxt(countBy(noHO, x => x.m.store).map(e => `${e[0]} (${e[1]})`), 8)}</div></div>
          </div>
        </div>`;

      const root = getComputedStyle(document.documentElement);
      const tc = root.getPropertyValue('--text-main').trim(), mc = root.getPropertyValue('--text-muted').trim();
      const ml = monthEntries(flat.map(x => x.m), true).map(e => e[0]).slice(-12);
      const colors = ['#c9a96e', '#8c7a5a', '#e6d3a3'];
      chartInstances.allTrend = new Chart(document.getElementById('allTrendChart').getContext('2d'), {
        type: 'bar',
        data: { labels: ml, datasets: mods.map((t, i) => ({ label: t.toUpperCase(), data: ml.map(l => per[i].filter(x => x.m.month === l).length), backgroundColor: colors[i], borderRadius: 4 })) },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { color: mc }, grid: { display: false } },
            y: { stacked: true, beginAtZero: true, ticks: { color: mc, precision: 0 }, grid: { color: 'rgba(148,163,184,.15)' } }
          },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, color: tc } } }
        }
      });
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const nt = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nt);
      try { localStorage.setItem('theme', nt); } catch (e) {}
      renderCurrentModule();
    });
    document.getElementById('manualSyncBtn').addEventListener('click', fetchLatestData);

    document.addEventListener('DOMContentLoaded', () => {
      initSummaryHosts();
      fetchLatestData();
      setInterval(fetchLatestData, AUTO_REFRESH_INTERVAL);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchLatestData();
      });
    });
  </script>
<div class="modal-ov" id="modalOv" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-h"><div><div class="modal-t" id="modalT"></div><div class="muted" id="modalS" style="font-size:.82rem;margin-top:2px"></div></div><button class="btn-theme" onclick="closeModal()" aria-label="Tutup">✕</button></div>
      <div class="controls-row"><input id="modalQ" class="search-box" placeholder="Cari di detail..." oninput="renderModal()"></div>
      <div class="table-container" id="modalB"></div>
    </div>
  </div>
</body>
</html>
